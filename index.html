<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--orange:#ff9f0a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#000}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:Fredoka,sans-serif}
main{width:min(100%,390px);display:grid;grid-template-columns:1fr;gap:16px}
button{appearance:none;border:0;min-height:112px;border-radius:999px;background:#292929;color:#fff;font:600 clamp(25px,7vw,34px) Fredoka,sans-serif;letter-spacing:.2px;cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .12s;box-shadow:0 5px 0 #171717}
button:active{transform:scale(.975);filter:brightness(1.2)}
button:first-child{background:var(--orange);color:#fff;box-shadow:0 5px 0 #a95e00}
@media(min-width:560px){main{grid-template-columns:1fr 1fr;gap:14px}button{min-height:150px}}
</style>
</head>
<body>
<main aria-label="Websites">
<button type="button" data-url="https://playswiper.com/">Swiper</button>
<button type="button" data-url="https://www.mystarsnight.com/home">Mystarsnight</button>
</main>
<script>
'use strict';
document.querySelectorAll('button[data-url]').forEach(button=>{
  button.addEventListener('click',()=>{
    const destination=button.dataset.url;
    const tab=window.open('about:blank','_blank');
    if(!tab)return;
    try{tab.opener=null;tab.location.replace(destination);tab.focus();}
    catch(error){tab.location.href=destination;}
  });
});
</script>
</body>
</html>
