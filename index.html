    this.ctx.globalAlpha = 1;\n            },\n\n            drawNext() {\n                this.nextCtx.fillStyle = PAL.bg;\n                this.nextCtx.fillRect(0, 0, 100, 100);\n                const piece = this.nextPiece;\n                const startX = (100 - piece.shape[0].length * 20) / 2;\n                const startY = (100 - piece.shape.length * 20) / 2;\n                this.nextCtx.save();\n                this.nextCtx.shadowColor = piece.color;\n                this.nextCtx.shadowBlur = 10;\n                for (let row = 0; row < piece.shape.length; row++) {\n                    for (let col = 0; col < piece.shape[row].length; col++) {\n                        if (piece.shape[row][col] !== 0) {\n                            const px = startX + col * 20;\n                            const py = startY + row * 20;\n                            const g = this.nextCtx.createLinearGradient(px, py, px, py + 18);\n                            g.addColorStop(0, this.lighten(piece.color, 0.4));\n                            g.addColorStop(1, piece.color);\n                            this.nextCtx.fillStyle = g;\n                            this.nextCtx.fillRect(px, py, 18, 18);\n                            this.nextCtx.strokeStyle = 'rgba(255,255,255,0.5)';\n                            this.nextCtx.strokeRect(px + 1, py + 1, 16, 16);\n                        }\n                    }\n                }\n                this.nextCtx.restore();\n            },\n\n            gameLoop() {\n                const now = Date.now();\n                const deltaTime = (now - this.lastDropTime) / 1000;\n                if (this.screen === 'playing' && !this.gameOver && !this.isPaused && deltaTime > 1 / this.dropSpeed) {\n                    this.drop();\n                    this.lastDropTime = now;\n                }\n                if (this.screen !== 'playing') this.lastDropTime = now;\n                this.draw();\n                requestAnimationFrame(() => this.gameLoop());\n            },\n\n            setDifficulty(idx) {\n                this.diffIndex = idx;\n                this.difficulty = ['easy','medium','hard'][idx];\n                localStorage.setItem('tetris-difficulty', this.difficulty);\n                this.applyDifficulty();\n            },\n\n            startGame() {\n                audio.ensure();\n                this.screen = 'playing';\n                this.lastDropTime = Date.now();\n                document.getElementById('gameStatus').textContent = 'Playing';\n            },\n\n            setupKeyBindings() {\n                document.addEventListener('keydown', (e) => {\n                    if (this.screen === 'title') {\n                        if (e.key === '1') this.setDifficulty(0);\n                        if (e.key === '2') this.setDifficulty(1);\n                        if (e.key === '3') this.setDifficulty(2);\n                        if (e.key === 'Enter' || e.key === ' ') { this.startGame(); e.preventDefault(); return; }\n                    }\n                    if (this.screen === 'gameover' && e.key === 'Enter') { this.restart(); return; }\n                    if (e.key.toLowerCase() === 'm') audio.toggleMute();\n\n                    if (this.gameOver || this.isPaused) {\n                        if (e.key === 'p' || e.key === 'P') this.togglePause();\n                        return;\n                    }\n                    if (this.screen !== 'playing') return;\n\n                    switch(e.key) {\n                        case 'ArrowLeft': this.move(-1); break;\n                        case 'ArrowRight': this.move(1); break;\n                        case 'z': case 'Z': this.rotate(); break;\n                        case 'x': case 'X': this.rotate(); this.rotate(); this.rotate(); break;\n                        case ' ': this.hardDrop(); e.preventDefault(); break;\n                        case 'p': case 'P': this.togglePause(); break;\n                        case 'ArrowDown': this.drop(); break;\n                    }\n                });\n            },\n\n            togglePause() {\n                if (!this.gameOver) {\n                    this.isPaused = !this.isPaused;\n                    document.getElementById('gameStatus').textContent = this.isPaused ? 'PAUSED' : 'Playing';\n                }\n            },\n\n            restart() {\n                this.initGrid();\n                this.score = 0;\n                this.lines = 0;\n                this.level = 1;\n                this.blocksPlaced = 0;\n                this.applyDifficulty();\n                this.gameOver = false;\n                this.isPaused = false;\n                this.particles = [];\n                this.popups = [];\n                this.lastDropTime = Date.now();\n                this.screen = 'title';\n                this.screenAlpha = 0;\n                this.nextPiece = null;\n                document.getElementById('gameStatus').textContent = 'Ready to play';\n                this.spawn();\n                this.draw();\n            }\n        };\n\n        game.init();\n    <\/script>\n</body>\n</html>\n","snake":"<!-- Source: https://github.com/prateek121/90s-games/blob/main/games/snake.html\nMIT License. Copyright (c) 2026 Prateek. Original game source retained. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>SNAKE - 90s Games</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n            background: linear-gradient(160deg, #0c1f12 0%, #04120a 60%, #02080a 100%);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            padding: 20px;\n            color: #d6ffd6;\n        }\n        .container {\n            display: flex;\n            gap: 30px;\n            align-items: center;\n            flex-wrap: wrap;\n            justify-content: center;\n        }\n        canvas#gameCanvas {\n            border: 3px solid #3eea8a;\n            background: #07140e;\n            display: block;\n            image-rendering: pixelated;\n            box-shadow: 0 0 40px rgba(62, 234, 138, 0.25);\n            border-radius: 4px;\n        }\n        .info { color: #d6ffd6; min-width: 250px; }\n        .stat-box {\n            background: rgba(62, 234, 138, 0.08);\n            border: 2px solid #3eea8a;\n            padding: 14px;\n            margin-bottom: 14px;\n            border-radius: 4px;\n        }\n        .stat-label { font-size: 12px; color: #ffe66d; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }\n        .stat-value { font-size: 28px; color: #d6ffd6; }\n        button {\n            width: 100%;\n            padding: 10px;\n            background: #3eea8a;\n            color: #04120a;\n            border: none;\n            font-weight: bold;\n            cursor: pointer;\n            margin: 5px 0;\n            border-radius: 4px;\n            font-family: inherit;\n        }\n        button:hover { background: #ffe66d; }\n        .instructions {\n            background: rgba(62, 234, 138, 0.06);\n            border: 2px solid #3eea8a;\n            padding: 12px;\n            font-size: 12px;\n            color: #d6ffd6;\n            border-radius: 4px;\n            line-height: 1.6;\n        }\n        .instructions p { margin: 5px 0; }\n        .modes {\n            background: rgba(255, 230, 109, 0.08);\n            border: 2px solid #ffe66d;\n            padding: 12px;\n            margin-top: 15px;\n            border-radius: 4px;\n        }\n        .mode-btn {\n            padding: 8px;\n            font-size: 12px;\n            margin: 5px 0;\n            background: #ffe66d;\n            color: #04120a;\n            border: none;\n            cursor: pointer;\n            border-radius: 4px;\n            font-weight: bold;\n            font-family: inherit;\n            width: 100%;\n        }\n        .mode-btn.active { background: #ff6e9c; color: #fff; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <canvas id=\"gameCanvas\" width=\"400\" height=\"400\"></canvas>\n        <div class=\"info\">\n            <div class=\"stat-box\"><div class=\"stat-label\">SCORE</div><div class=\"stat-value\" id=\"score\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">HIGH SCORE</div><div class=\"stat-value\" id=\"highScore\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">LENGTH</div><div class=\"stat-value\" id=\"length\">3</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">LEVEL</div><div class=\"stat-value\" id=\"level\">1</div></div>\n            <button onclick=\"game.start()\">START GAME</button>\n            <button onclick=\"game.restart()\">NEW GAME</button>\n            <button onclick=\"location.href='../'\">BACK</button>\n            <div class=\"instructions\">\n                <p><strong>ARROW KEYS</strong> Move snake</p>\n                <p><strong>SPACE</strong> Pause / Resume</p>\n                <p><strong>M</strong> Mute &nbsp; <strong>ENTER</strong> Restart</p>\n                <p><strong>1/2/3</strong> Difficulty (on title)</p>\n            </div>\n            <div class=\"modes\">\n                <div class=\"stat-label\">MODE SELECT</div>\n                <button class=\"mode-btn active\" onclick=\"game.setMode('classic', this)\">Classic</button>\n                <button class=\"mode-btn\" onclick=\"game.setMode('wrap', this)\">Wrap Edges</button>\n                <button class=\"mode-btn\" onclick=\"game.setMode('obstacles', this)\">Obstacles</button>\n            </div>\n        </div>\n    </div>\n\n    <script>\n        const GRID_SIZE = 20;\n        const CELL_SIZE = 20;\n\n        const PAL = {\n            bg: '#07140e', grid: '#10301e',\n            snake: '#3eea8a', food: '#ffe66d',\n            danger: '#ff6e9c', white: '#d6ffd6'\n        };\n\n        const audio = {\n            ctx: null,\n            muted: localStorage.getItem('snake-muted') === '1',\n            ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } },\n            beep(freq, dur, type, vol) {\n                if (this.muted) return;\n                this.ensure(); if (!this.ctx) return;\n                const t = this.ctx.currentTime;\n                const o = this.ctx.createOscillator();\n                const g = this.ctx.createGain();\n                o.type = type || 'square';\n                o.frequency.setValueAtTime(freq, t);\n                g.gain.setValueAtTime(0.0001, t);\n                g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);\n                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n                o.connect(g); g.connect(this.ctx.destination);\n                o.start(t); o.stop(t + dur + 0.02);\n            },\n            eat()    { this.beep(660, 0.08, 'square', 0.12); this.beep(880, 0.08, 'square', 0.1); },\n            level()  { this.beep(523, 0.1, 'triangle', 0.14); this.beep(784, 0.15, 'triangle', 0.14); },\n            die()    { this.beep(220, 0.25, 'sawtooth', 0.18); this.beep(110, 0.4, 'sawtooth', 0.14); },\n            toggleMute() { this.muted = !this.muted; localStorage.setItem('snake-muted', this.muted?'1':'0'); }\n        };\n\n        const game = {\n            canvas: document.getElementById('gameCanvas'),\n            ctx: null,\n            snake: [], food: null, obstacles: [],\n            direction: { x: 1, y: 0 },\n            nextDirection: { x: 1, y: 0 },\n            score: 0,\n            highScore: parseInt(localStorage.getItem('snake-highscore') || '0', 10),\n            level: 1,\n            gameRunning: false, gamePaused: false, gameOver: false,\n            lastMoveTime: 0,\n            moveDelay: 110, baseDelay: 110,\n            mode: 'classic',\n            foodEaten: 0,\n            screen: 'title', screenAlpha: 0,\n            difficulty: localStorage.getItem('snake-difficulty') || 'medium',\n            diffIndex: 1,\n            renderSnake: [],\n            foodPulse: 0,\n            particles: [], popups: [],\n            shakeAmount: 0, shakeDuration: 0, shakeX: 0, shakeY: 0,\n\n            init() {\n                this.ctx = this.canvas.getContext('2d');\n                this.diffIndex = ['easy','medium','hard'].indexOf(this.difficulty);\n                if (this.diffIndex < 0) { this.diffIndex = 1; this.difficulty = 'medium'; }\n                this.applyDifficulty();\n                this.restart(true);\n                this.setupInput();\n                this.gameLoop();\n            },\n\n            applyDifficulty() {\n                this.baseDelay = [150, 110, 75][this.diffIndex];\n                this.moveDelay = this.baseDelay;\n            },\n\n            restart(toTitle) {\n                this.snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];\n                this.renderSnake = this.snake.map(s => ({ x: s.x, y: s.y }));\n                this.score = 0;\n                this.level = 1;\n                this.gameRunning = false;\n                this.gamePaused = false;\n                this.gameOver = false;\n                this.direction = { x: 1, y: 0 };\n                this.nextDirection = { x: 1, y: 0 };\n                this.lastMoveTime = 0;\n                this.applyDifficulty();\n                this.foodEaten = 0;\n                this.obstacles = [];\n                this.particles = [];\n                this.popups = [];\n                if (this.mode === 'obstacles') this.generateObstacles();\n                this.spawnFood();\n                this.screen = 'title';\n                this.screenAlpha = 0;\n                document.getElementById('score').textContent = '0';\n                document.getElementById('length').textContent = '3';\n                document.getElementById('level').textContent = '1';\n                document.getElementById('highScore').textContent = this.highScore;\n            },\n\n            start() {\n                if (!this.gameRunning && !this.gameOver) {\n                    audio.ensure();\n                    this.gameRunning = true;\n                    this.gamePaused = false;\n                    this.lastMoveTime = Date.now();\n                    this.screen = 'playing';\n                    this.screenAlpha = 0;\n                }\n            },\n\n            setMode(mode, btn) {\n                this.mode = mode;\n                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));\n                if (btn) btn.classList.add('active');\n                this.restart(true);\n            },\n\n            setDifficulty(idx) {\n                this.diffIndex = idx;\n                this.difficulty = ['easy','medium','hard'][idx];\n                localStorage.setItem('snake-difficulty', this.difficulty);\n                this.applyDifficulty();\n            },\n\n            generateObstacles() {\n                const count = Math.floor(GRID_SIZE * GRID_SIZE * 0.15);\n                this.obstacles = [];\n                for (let i = 0; i < count; i++) {\n                    let x, y;\n                    do {\n                        x = Math.floor(Math.random() * GRID_SIZE);\n                        y = Math.floor(Math.random() * GRID_SIZE);\n                    } while (\n                        (x < 3 && y < 3) ||\n                        (Math.abs(x - this.snake[0].x) < 3 && Math.abs(y - this.snake[0].y) < 3)\n                    );\n                    this.obstacles.push({x, y});\n                }\n            },\n\n            spawnFood() {\n                let x, y;\n                do {\n                    x = Math.floor(Math.random() * GRID_SIZE);\n                    y = Math.floor(Math.random() * GRID_SIZE);\n                } while (\n                    this.snake.some(seg => seg.x === x && seg.y === y) ||\n                    this.obstacles.some(obs => obs.x === x && obs.y === y)\n                );\n                this.food = {x, y};\n            },\n\n            shake(amount, dur) {\n                this.shakeAmount = Math.max(this.shakeAmount, amount);\n                this.shakeDuration = Math.max(this.shakeDuration, dur);\n            },\n\n            addPopup(x, y, text, color) {\n                this.popups.push({ x: x * CELL_SIZE + CELL_SIZE/2, y: y * CELL_SIZE, text, color: color || PAL.food, life: 50, max: 50 });\n            },\n\n            createParticles(x, y, n, color) {\n                for (let i = 0; i < n; i++) {\n                    this.particles.push({\n                        x: x * CELL_SIZE + CELL_SIZE/2,\n                        y: y * CELL_SIZE + CELL_SIZE/2,\n                        vx: (Math.random() - 0.5) * 4,\n                        vy: (Math.random() - 0.5) * 4,\n                        life: 30, max: 30,\n                        size: 2 + Math.random() * 2,\n                        color: color || PAL.food\n                    });\n                }\n                if (this.particles.length > 200) this.particles.splice(0, this.particles.length - 200);\n            },\n\n            update() {\n                this.foodPulse += 0.1;\n                if (this.shakeDuration > 0) {\n                    this.shakeDuration--;\n                    const decay = Math.exp(-0.05 * (30 - this.shakeDuration));\n                    this.shakeX = (Math.random() - 0.5) * this.shakeAmount * decay;\n                    this.shakeY = (Math.random() - 0.5) * this.shakeAmount * decay;\n                    if (this.shakeDuration <= 0) { this.shakeAmount = 0; this.shakeX = 0; this.shakeY = 0; }\n                }\n                this.screenAlpha = Math.min(1, this.screenAlpha + 0.04);\n\n                for (let i = this.popups.length - 1; i >= 0; i--) {\n                    this.popups[i].y -= 0.8;\n                    this.popups[i].life--;\n                    if (this.popups[i].life <= 0) this.popups.splice(i, 1);\n                }\n                for (let i = this.particles.length - 1; i >= 0; i--) {\n                    const p = this.particles[i];\n                    p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96;\n                    p.life--;\n                    if (p.life <= 0) this.particles.splice(i, 1);\n                }\n\n                for (let i = 0; i < this.snake.length; i++) {\n                    if (!this.renderSnake[i]) this.renderSnake[i] = { x: this.snake[i].x, y: this.snake[i].y };\n                    this.renderSnake[i].x += (this.snake[i].x - this.renderSnake[i].x) * 0.35;\n                    this.renderSnake[i].y += (this.snake[i].y - this.renderSnake[i].y) * 0.35;\n                }\n                while (this.renderSnake.length > this.snake.length) this.renderSnake.pop();\n\n                if (!this.gameRunning || this.gamePaused) return;\n\n                const now = Date.now();\n                if (now - this.lastMoveTime < this.moveDelay) return;\n\n                this.direction = {...this.nextDirection};\n                const head = this.snake[0];\n                let newHead = { x: head.x + this.direction.x, y: head.y + this.direction.y };\n\n                if (this.mode === 'wrap') {\n                    newHead.x = (newHead.x + GRID_SIZE) % GRID_SIZE;\n                    newHead.y = (newHead.y + GRID_SIZE) % GRID_SIZE;\n                } else {\n                    if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {\n                        this.endGame();\n                        return;\n                    }\n                }\n\n                if (this.snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) { this.endGame(); return; }\n                if (this.obstacles.some(obs => obs.x === newHead.x && obs.y === newHead.y)) { this.endGame(); return; }\n\n                this.snake.unshift(newHead);\n                this.renderSnake.unshift({ x: newHead.x, y: newHead.y });\n\n                if (newHead.x === this.food.x && newHead.y === this.food.y) {\n                    const gain = 10 * this.level;\n                    this.score += gain;\n                    this.foodEaten++;\n                    audio.eat();\n                    this.createParticles(this.food.x, this.food.y, 12, PAL.food);\n                    this.addPopup(this.food.x, this.food.y, '+' + gain, PAL.food);\n                    if (this.foodEaten % 5 === 0) {\n                        this.level++;\n                        this.moveDelay = Math.max(45, this.baseDelay - (this.level - 1) * 6);\n                        this.addPopup(GRID_SIZE/2 - 1, GRID_SIZE/2 - 1, 'LEVEL ' + this.level, PAL.snake);\n                        this.shake(4, 16);\n                        audio.level();\n                    }\n                    this.spawnFood();\n                } else {\n                    this.snake.pop();\n                }\n\n                this.lastMoveTime = now;\n            },\n\n            drawBackground() {\n                this.ctx.fillStyle = PAL.bg;\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                const g = this.ctx.createRadialGradient(this.canvas.width/2, this.canvas.height/2, 40, this.canvas.width/2, this.canvas.height/2, this.canvas.width*0.8);\n                g.addColorStop(0, 'rgba(62,234,138,0.04)');\n                g.addColorStop(1, 'rgba(0,0,0,0.5)');\n                this.ctx.fillStyle = g;\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.strokeStyle = PAL.grid;\n                this.ctx.lineWidth = 1;\n                for (let i = 0; i <= GRID_SIZE; i++) {\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(i * CELL_SIZE + 0.5, 0);\n                    this.ctx.lineTo(i * CELL_SIZE + 0.5, this.canvas.height);\n                    this.ctx.stroke();\n                    this.ctx.beginPath();\n                    this.ctx.moveTo(0, i * CELL_SIZE + 0.5);\n                    this.ctx.lineTo(this.canvas.width, i * CELL_SIZE + 0.5);\n                    this.ctx.stroke();\n                }\n            },\n\n            draw() {\n                this.ctx.save();\n                this.ctx.translate(this.shakeX, this.shakeY);\n                this.drawBackground();\n\n                for (let obs of this.obstacles) {\n                    const x = obs.x * CELL_SIZE, y = obs.y * CELL_SIZE;\n                    const g = this.ctx.createLinearGradient(x, y, x, y + CELL_SIZE);\n                    g.addColorStop(0, '#7a1a36');\n                    g.addColorStop(1, PAL.danger);\n                    this.ctx.fillStyle = g;\n                    this.ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);\n                }\n\n                this.ctx.save();\n                const fx = this.food.x * CELL_SIZE + CELL_SIZE / 2;\n                const fy = this.food.y * CELL_SIZE + CELL_SIZE / 2;\n                const pulse = 1 + Math.sin(this.foodPulse) * 0.12;\n                this.ctx.shadowColor = PAL.food;\n                this.ctx.shadowBlur = 14;\n                const fg = this.ctx.createRadialGradient(fx-2, fy-2, 1, fx, fy, (CELL_SIZE/2-1) * pulse);\n                fg.addColorStop(0, '#fffbe6');\n                fg.addColorStop(1, PAL.food);\n                this.ctx.fillStyle = fg;\n                this.ctx.beginPath();\n                this.ctx.arc(fx, fy, (CELL_SIZE / 2 - 2) * pulse, 0, Math.PI * 2);\n                this.ctx.fill();\n                this.ctx.restore();\n\n                for (let i = this.renderSnake.length - 1; i >= 0; i--) {\n                    const seg = this.renderSnake[i];\n                    const x = seg.x * CELL_SIZE;\n                    const y = seg.y * CELL_SIZE;\n                    if (i === 0) {\n                        this.ctx.save();\n                        this.ctx.shadowColor = PAL.snake;\n                        this.ctx.shadowBlur = 12;\n                        const g = this.ctx.createLinearGradient(x, y, x + CELL_SIZE, y + CELL_SIZE);\n                        g.addColorStop(0, '#a8ffcd');\n                        g.addColorStop(1, PAL.snake);\n                        this.ctx.fillStyle = g;\n                        this.ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);\n                        this.ctx.fillStyle = '#04120a';\n                        const dx = this.direction.x, dy = this.direction.y;\n                        this.ctx.fillRect(x + 6 + dx*3, y + 5 + dy*3, 3, 3);\n                        this.ctx.fillRect(x + CELL_SIZE - 9 + dx*3, y + 5 + dy*3, 3, 3);\n                        this.ctx.restore();\n                    } else {\n                        const t = i / this.renderSnake.length;\n                        const g = this.ctx.createLinearGradient(x, y, x + CELL_SIZE, y + CELL_SIZE);\n                        g.addColorStop(0, PAL.snake);\n                        g.addColorStop(1, '#1ea76a');\n                        this.ctx.fillStyle = g;\n                        this.ctx.globalAlpha = 0.85 - t * 0.3;\n                        this.ctx.fillRect(x + 2, y + 2, CELL_SIZE - 4, CELL_SIZE - 4);\n                        this.ctx.globalAlpha = 1;\n                    }\n                }\n\n                for (const p of this.particles) {\n                    this.ctx.globalAlpha = p.life / p.max;\n                    this.ctx.fillStyle = p.color;\n                    this.ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);\n                }\n                this.ctx.globalAlpha = 1;\n\n                for (const pp of this.popups) {\n                    this.ctx.globalAlpha = pp.life / pp.max;\n                    this.ctx.font = 'bold 16px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    this.ctx.textAlign = 'center';\n                    this.ctx.lineWidth = 3;\n                    this.ctx.strokeStyle = '#000';\n                    this.ctx.strokeText(pp.text, pp.x, pp.y);\n                    this.ctx.fillStyle = pp.color;\n                    this.ctx.fillText(pp.text, pp.x, pp.y);\n                }\n                this.ctx.globalAlpha = 1;\n                this.ctx.textAlign = 'left';\n\n                this.ctx.font = 'bold 18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.lineWidth = 3;\n                this.ctx.strokeStyle = '#000';\n                this.ctx.strokeText('SCORE ' + this.score, 8, 22);\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.fillText('SCORE ' + this.score, 8, 22);\n                this.ctx.font = 'bold 14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.strokeText('HI ' + this.highScore, 8, 40);\n                this.ctx.fillStyle = PAL.food;\n                this.ctx.fillText('HI ' + this.highScore, 8, 40);\n                if (audio.muted) {\n                    this.ctx.fillStyle = PAL.danger;\n                    this.ctx.fillText('MUTED', this.canvas.width - 60, 22);\n                }\n\n                document.getElementById('score').textContent = this.score;\n                document.getElementById('length').textContent = this.snake.length;\n                document.getElementById('level').textContent = this.level;\n                document.getElementById('highScore').textContent = this.highScore;\n\n                if (this.screen === 'title') this.drawTitle();\n                else if (this.gamePaused) this.drawPause();\n                if (this.gameOver) this.drawGameOver();\n\n                this.ctx.restore();\n            },\n\n            drawTitle() {\n                this.ctx.globalAlpha = this.screenAlpha;\n                this.ctx.fillStyle = 'rgba(7,20,14,0.8)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.textAlign = 'center';\n                this.ctx.shadowColor = PAL.snake;\n                this.ctx.shadowBlur = 18;\n                this.ctx.fillStyle = PAL.snake;\n                this.ctx.font = 'bold 54px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('SNAKE', this.canvas.width/2, 110);\n                this.ctx.shadowBlur = 0;\n                this.ctx.font = 'bold 18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.fillText('DIFFICULTY: ' + this.difficulty.toUpperCase(), this.canvas.width/2, 170);\n                this.ctx.font = '12px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillStyle = PAL.food;\n                this.ctx.fillText('1 = Easy   2 = Medium   3 = Hard', this.canvas.width/2, 192);\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.font = '12px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                const lines = [\n                    'Arrow Keys to move',\n                    'SPACE to pause',\n                    'M to mute',\n                    '',\n                    'Press ENTER or SPACE to begin'\n                ];\n                lines.forEach((l, i) => this.ctx.fillText(l, this.canvas.width/2, 235 + i * 20));\n                this.ctx.textAlign = 'left';\n                this.ctx.globalAlpha = 1;\n            },\n\n            drawPause() {\n                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.font = 'bold 24px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.textAlign = 'center';\n                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);\n                this.ctx.textAlign = 'left';\n            },\n\n            drawGameOver() {\n                this.ctx.globalAlpha = this.screenAlpha;\n                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.textAlign = 'center';\n                this.ctx.fillStyle = PAL.danger;\n                this.ctx.shadowColor = PAL.danger;\n                this.ctx.shadowBlur = 16;\n                this.ctx.font = 'bold 36px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2 - 40);\n                this.ctx.shadowBlur = 0;\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.font = 'bold 18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('Final: ' + this.score, this.canvas.width / 2, this.canvas.height / 2);\n                this.ctx.fillStyle = PAL.food;\n                this.ctx.fillText('High: ' + this.highScore, this.canvas.width / 2, this.canvas.height / 2 + 26);\n                this.ctx.fillStyle = PAL.snake;\n                this.ctx.font = '14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('Press ENTER to restart', this.canvas.width / 2, this.canvas.height / 2 + 60);\n                this.ctx.textAlign = 'left';\n                this.ctx.globalAlpha = 1;\n            },\n\n            endGame() {\n                this.gameRunning = false;\n                this.gameOver = true;\n                this.shake(10, 24);\n                this.createParticles(this.snake[0].x, this.snake[0].y, 24, PAL.danger);\n                audio.die();\n                if (this.score > this.highScore) {\n                    this.highScore = this.score;\n                    localStorage.setItem('snake-highscore', String(this.highScore));\n                }\n                this.screenAlpha = 0;\n            },\n\n            setupInput() {\n                document.addEventListener('keydown', (e) => {\n                    if (this.screen === 'title') {\n                        if (e.key === '1') this.setDifficulty(0);\n                        if (e.key === '2') this.setDifficulty(1);\n                        if (e.key === '3') this.setDifficulty(2);\n                        if (e.key === 'Enter' || e.key === ' ') { this.start(); e.preventDefault(); return; }\n                    }\n                    if (this.gameOver && e.key === 'Enter') { this.restart(true); return; }\n                    if (e.key.toLowerCase() === 'm') audio.toggleMute();\n                    switch(e.key) {\n                        case 'ArrowUp':\n                            if (this.direction.y === 0) this.nextDirection = {x: 0, y: -1};\n                            break;\n                        case 'ArrowDown':\n                            if (this.direction.y === 0) this.nextDirection = {x: 0, y: 1};\n                            break;\n                        case 'ArrowLeft':\n                            if (this.direction.x === 0) this.nextDirection = {x: -1, y: 0};\n                            break;\n                        case 'ArrowRight':\n                            if (this.direction.x === 0) this.nextDirection = {x: 1, y: 0};\n                            break;\n                        case ' ':\n                            if (this.gameRunning) this.gamePaused = !this.gamePaused;\n                            e.preventDefault();\n                            break;\n                    }\n                });\n            },\n\n            gameLoop() {\n                this.update();\n                this.draw();\n                requestAnimationFrame(() => this.gameLoop());\n            }\n        };\n\n        game.init();\n    <\/script>\n</body>\n</html>\n","pacman":"<!-- Source: https://github.com/prateek121/90s-games/blob/main/games/pacman.html\nMIT License. Copyright (c) 2026 Prateek. Original game source retained. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>PAC-MAN - 90s Games</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n            background: radial-gradient(circle at top, #1a1a4a 0%, #000040 60%, #000020 100%);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            padding: 20px;\n            color: #ffe66d;\n        }\n        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }\n        canvas#gameCanvas {\n            border: 3px solid #ffe66d;\n            background: #000028;\n            display: block;\n            box-shadow: 0 0 40px rgba(255, 230, 109, 0.4);\n            border-radius: 4px;\n        }\n        .info { color: #ffe66d; min-width: 250px; font-family: inherit; }\n        .stat-box {\n            background: rgba(255, 230, 109, 0.08);\n            border: 2px solid #ffe66d;\n            padding: 14px;\n            margin-bottom: 14px;\n            border-radius: 4px;\n        }\n        .stat-label { font-size: 12px; margin-bottom: 5px; letter-spacing: 1px; color: #ff6e9c; }\n        .stat-value { font-size: 26px; font-weight: bold; color: #ffe66d; }\n        button {\n            width: 100%;\n            padding: 10px;\n            background: #ffe66d;\n            color: #000028;\n            border: 1px solid #ffe66d;\n            font-weight: bold;\n            cursor: pointer;\n            margin: 5px 0;\n            font-family: inherit;\n            border-radius: 4px;\n        }\n        button:hover { background: #ff6e9c; border-color: #ff6e9c; color: #fff; }\n        .controls {\n            background: rgba(255, 230, 109, 0.06);\n            border: 2px solid #ffe66d;\n            padding: 10px;\n            font-size: 12px;\n            border-radius: 4px;\n            margin-bottom: 15px;\n            line-height: 1.6;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <canvas id=\"gameCanvas\" width=\"400\" height=\"420\"></canvas>\n        <div class=\"info\">\n            <div class=\"stat-box\"><div class=\"stat-label\">SCORE</div><div class=\"stat-value\" id=\"score\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">HIGH SCORE</div><div class=\"stat-value\" id=\"highScore\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">LEVEL</div><div class=\"stat-value\" id=\"level\">1</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">LIVES</div><div class=\"stat-value\" id=\"lives\">3</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">DOTS LEFT</div><div class=\"stat-value\" id=\"dots\">240</div></div>\n            <div class=\"controls\">\n                <strong>CONTROLS</strong><br/>\n                Arrow Keys - Move<br/>\n                P - Pause &nbsp; M - Mute<br/>\n                ENTER - Restart<br/>\n                1/2/3 - Difficulty (on title)\n            </div>\n            <button onclick=\"game.start()\">START GAME</button>\n            <button onclick=\"game.restart()\">NEW GAME</button>\n            <button onclick=\"location.href='../'\">BACK</button>\n        </div>\n    </div>\n\n    <script>\n        const GRID_SIZE = 20;\n        const CELL_SIZE = 20;\n        const COLS = 20;\n        const ROWS = 18;\n\n        const PAL = {\n            bg: '#000028', wall: '#3b58ff',\n            yellow: '#ffe66d', pink: '#ff6e9c',\n            cyan: '#4dd0ff', white: '#fff5d6'\n        };\n\n        const audio = {\n            ctx: null,\n            muted: localStorage.getItem('pacman-muted') === '1',\n            ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } },\n            beep(freq, dur, type, vol) {\n                if (this.muted) return;\n                this.ensure(); if (!this.ctx) return;\n                const t = this.ctx.currentTime;\n                const o = this.ctx.createOscillator();\n                const g = this.ctx.createGain();\n                o.type = type || 'square';\n                o.frequency.setValueAtTime(freq, t);\n                g.gain.setValueAtTime(0.0001, t);\n                g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01);\n                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n                o.connect(g); g.connect(this.ctx.destination);\n                o.start(t); o.stop(t + dur + 0.02);\n            },\n            dot()    { this.beep(523 + (Math.random()*40), 0.04, 'square', 0.05); },\n            pellet() { this.beep(330, 0.15, 'triangle', 0.14); this.beep(440, 0.15, 'triangle', 0.1); },\n            ghost()  { this.beep(800, 0.1, 'square', 0.16); this.beep(1100, 0.12, 'square', 0.14); },\n            die()    { this.beep(220, 0.3, 'sawtooth', 0.18); this.beep(110, 0.45, 'sawtooth', 0.14); },\n            level()  { this.beep(523, 0.1, 'triangle', 0.14); this.beep(784, 0.15, 'triangle', 0.14); },\n            toggleMute() { this.muted = !this.muted; localStorage.setItem('pacman-muted', this.muted?'1':'0'); }\n        };\n\n        const game = {\n            canvas: document.getElementById('gameCanvas'),\n            ctx: null,\n            maze: [],\n            pacman: { x: 10, y: 16, direction: 0, nextDirection: 0, mouthOpen: true, renderX: 10, renderY: 16 },\n            ghosts: [],\n            dots: [],\n            powerPellets: [],\n            score: 0,\n            highScore: parseInt(localStorage.getItem('pacman-highscore') || '0', 10),\n            level: 1,\n            lives: 3,\n            gameRunning: false,\n            gamePaused: false,\n            gameOver: false,\n            powerPelletActive: false,\n            powerPelletTimer: 0,\n            mouthTimer: 0,\n            totalDots: 0,\n            tick: 0,\n\n            screen: 'title',\n            screenAlpha: 0,\n\n            difficulty: localStorage.getItem('pacman-difficulty') || 'medium',\n            diffIndex: 1,\n            // Difficulty scaling: ghost speed (mod numerator).\n            // Tick-based speed fix preserved: Pac-Man % 8, ghosts % 10 (medium baseline).\n            ghostMod: 10,\n            pacmanMod: 8,\n\n            particles: [], popups: [],\n            shakeAmount: 0, shakeDuration: 0, shakeX: 0, shakeY: 0,\n\n            init() {\n                this.ctx = this.canvas.getContext('2d');\n                this.diffIndex = ['easy','medium','hard'].indexOf(this.difficulty);\n                if (this.diffIndex < 0) { this.diffIndex = 1; this.difficulty = 'medium'; }\n                this.applyDifficulty();\n                this.createMaze();\n                this.createGhosts();\n                this.placeDots();\n                this.setupInput();\n                this.gameLoop();\n            },\n\n            applyDifficulty() {\n                // Larger mod = slower. Easy makes ghosts slower (12), Hard faster (8).\n                // Pac-Man keeps % 8 baseline regardless to preserve fix.\n                this.ghostMod = [13, 10, 8][this.diffIndex];\n                this.pacmanMod = 8;\n            },\n\n            createMaze() {\n                const mazeData = [\n                    '####################',\n                    '#........#.........#',\n                    '#.##.####.####.##..#',\n                    '#.##.####.####.##..#',\n                    '#..................#',\n                    '#.####.#...#.####..#',\n                    '#......#...#.....#.#',\n                    '#.#####.###..#####.#',\n                    '#..................#',\n                    '#.####.####.#####..#',\n                    '#.....#.....#....#.#',\n                    '#.#####.###.#.###..#',\n                    '#..................#',\n                    '#.##.####.####.##..#',\n                    '#....#....#.....#..#',\n                    '#.#####.##########.#',\n                    '#..................#',\n                    '####################',\n                ];\n                this.maze = mazeData.map(row => row.split(''));\n            },\n\n            createGhosts() {\n                this.ghosts = [\n                    { x: 9, y: 10, color: '#ff5d5d', direction: 1, renderX: 9, renderY: 10 },\n                    { x: 10, y: 10, color: '#ff6e9c', direction: 0, renderX: 10, renderY: 10 },\n                    { x: 8, y: 12, color: '#4dd0ff', direction: 1, renderX: 8, renderY: 12 },\n                    { x: 11, y: 12, color: '#ffb851', direction: 0, renderX: 11, renderY: 12 }\n                ];\n            },\n\n            placeDots() {\n                this.dots = [];\n                for (let y = 1; y < ROWS - 1; y++) {\n                    for (let x = 1; x < COLS - 1; x++) {\n                        if (this.maze[y][x] === '.') this.dots.push({ x, y });\n                    }\n                }\n                this.totalDots = this.dots.length;\n                this.powerPellets = [\n                    { x: 1, y: 1 },\n                    { x: 18, y: 1 },\n                    { x: 1, y: 15 },\n                    { x: 18, y: 15 }\n                ];\n            },\n\n            start() {\n                if (!this.gameRunning && !this.gameOver) {\n                    audio.ensure();\n                    this.gameRunning = true;\n                    this.screen = 'playing';\n                    this.screenAlpha = 0;\n                }\n            },\n\n            setDifficulty(idx) {\n                this.diffIndex = idx;\n                this.difficulty = ['easy','medium','hard'][idx];\n                localStorage.setItem('pacman-difficulty', this.difficulty);\n                this.applyDifficulty();\n            },\n\n            shake(amount, dur) {\n                this.shakeAmount = Math.max(this.shakeAmount, amount);\n                this.shakeDuration = Math.max(this.shakeDuration, dur);\n            },\n\n            addPopup(x, y, text, color) {\n                this.popups.push({ x: x * CELL_SIZE + CELL_SIZE/2, y: y * CELL_SIZE, text, color: color || PAL.yellow, life: 50, max: 50 });\n            },\n\n            createParticles(x, y, n, color) {\n                for (let i = 0; i < n; i++) {\n                    this.particles.push({\n                        x: x * CELL_SIZE + CELL_SIZE/2,\n                        y: y * CELL_SIZE + CELL_SIZE/2,\n                        vx: (Math.random() - 0.5) * 4,\n                        vy: (Math.random() - 0.5) * 4,\n                        life: 30, max: 30,\n                        size: 2 + Math.random() * 2,\n                        color: color || PAL.yellow\n                    });\n                }\n                if (this.particles.length > 200) this.particles.splice(0, this.particles.length - 200);\n            },\n\n            moveGhosts() {\n                const dirs = [[1, 0], [-1, 0], [0, -1], [0, 1]];\n                for (let ghost of this.ghosts) {\n                    const randomDir = dirs[Math.floor(Math.random() * dirs.length)];\n                    const nx = ghost.x + randomDir[0];\n                    const ny = ghost.y + randomDir[1];\n                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && this.maze[ny][nx] !== '#') {\n                        ghost.x = nx;\n                        ghost.y = ny;\n                    }\n                }\n            },\n\n            update() {\n                // lerps + visual systems always\n                this.pacman.renderX += (this.pacman.x - this.pacman.renderX) * 0.35;\n                this.pacman.renderY += (this.pacman.y - this.pacman.renderY) * 0.35;\n                for (const gh of this.ghosts) {\n                    gh.renderX += (gh.x - gh.renderX) * 0.3;\n                    gh.renderY += (gh.y - gh.renderY) * 0.3;\n                }\n                if (this.shakeDuration > 0) {\n                    this.shakeDuration--;\n                    const decay = Math.exp(-0.05 * (30 - this.shakeDuration));\n                    this.shakeX = (Math.random() - 0.5) * this.shakeAmount * decay;\n                    this.shakeY = (Math.random() - 0.5) * this.shakeAmount * decay;\n                    if (this.shakeDuration <= 0) { this.shakeAmount = 0; this.shakeX = 0; this.shakeY = 0; }\n                }\n                this.screenAlpha = Math.min(1, this.screenAlpha + 0.04);\n                for (let i = this.popups.length - 1; i >= 0; i--) {\n                    this.popups[i].y -= 0.8;\n                    this.popups[i].life--;\n                    if (this.popups[i].life <= 0) this.popups.splice(i, 1);\n                }\n                for (let i = this.particles.length - 1; i >= 0; i--) {\n                    const p = this.particles[i];\n                    p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96;\n                    p.life--;\n                    if (p.life <= 0) this.particles.splice(i, 1);\n                }\n\n                if (!this.gameRunning || this.gamePaused) return;\n\n                this.tick++;\n                // Preserved fix: Pac-Man moves on % pacmanMod, ghosts on % ghostMod.\n                const pacmanMoves = this.tick % this.pacmanMod === 0;\n                const ghostsMove = this.tick % this.ghostMod === 0;\n\n                if (!pacmanMoves) {\n                    this.mouthTimer++;\n                    if (this.mouthTimer > 10) {\n                        this.pacman.mouthOpen = !this.pacman.mouthOpen;\n                        this.mouthTimer = 0;\n                    }\n                    if (this.powerPelletActive) {\n                        this.powerPelletTimer--;\n                        if (this.powerPelletTimer <= 0) this.powerPelletActive = false;\n                    }\n                    if (ghostsMove) this.moveGhosts();\n                    return;\n                }\n\n                this.pacman.direction = this.pacman.nextDirection;\n                const dirs = [[1, 0], [-1, 0], [0, -1], [0, 1]];\n                const dir = dirs[this.pacman.direction];\n                const newX = this.pacman.x + dir[0];\n                const newY = this.pacman.y + dir[1];\n\n                if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS && this.maze[newY][newX] !== '#') {\n                    this.pacman.x = newX;\n                    this.pacman.y = newY;\n                }\n\n                for (let i = this.dots.length - 1; i >= 0; i--) {\n                    if (this.dots[i].x === this.pacman.x && this.dots[i].y === this.pacman.y) {\n                        this.dots.splice(i, 1);\n                        this.score += 10;\n                        audio.dot();\n                    }\n                }\n\n                for (let i = this.powerPellets.length - 1; i >= 0; i--) {\n                    if (this.powerPellets[i].x === this.pacman.x && this.powerPellets[i].y === this.pacman.y) {\n                        this.powerPellets.splice(i, 1);\n                        this.powerPelletActive = true;\n                        this.powerPelletTimer = 200;\n                        this.score += 50;\n                        audio.pellet();\n                        this.addPopup(this.pacman.x, this.pacman.y, '+50', PAL.pink);\n                        this.createParticles(this.pacman.x, this.pacman.y, 16, PAL.pink);\n                    }\n                }\n\n                if (ghostsMove) this.moveGhosts();\n\n                for (let ghost of this.ghosts) {\n                    if (ghost.x === this.pacman.x && ghost.y === this.pacman.y) {\n                        if (this.powerPelletActive) {\n                            this.createParticles(ghost.x, ghost.y, 18, PAL.cyan);\n                            this.addPopup(ghost.x, ghost.y, '+200', PAL.cyan);\n                            ghost.x = 10;\n                            ghost.y = 10;\n                            ghost.renderX = 10;\n                            ghost.renderY = 10;\n                            this.score += 200;\n                            audio.ghost();\n                        } else {\n                            this.lives--;\n                            audio.die();\n                            this.shake(10, 28);\n                            this.createParticles(this.pacman.x, this.pacman.y, 24, PAL.yellow);\n                            if (this.lives <= 0) {\n                                this.gameOver = true;\n                                this.gameRunning = false;\n                                this.screen = 'gameover';\n                                this.screenAlpha = 0;\n                                if (this.score > this.highScore) {\n                                    this.highScore = this.score;\n                                    localStorage.setItem('pacman-highscore', String(this.highScore));\n                                }\n                            }\n                            this.pacman = { x: 10, y: 15, direction: 0, nextDirection: 0, mouthOpen: true, renderX: 10, renderY: 15 };\n                        }\n                    }\n                }\n\n                if (this.dots.length === 0) {\n                    this.level++;\n                    audio.level();\n                    this.shake(5, 16);\n                    this.addPopup(COLS/2 - 1, ROWS/2 - 1, 'LEVEL ' + this.level, PAL.cyan);\n                    this.placeDots();\n                }\n\n                if (this.powerPelletActive) {\n                    this.powerPelletTimer--;\n                    if (this.powerPelletTimer <= 0) this.powerPelletActive = false;\n                }\n\n                this.mouthTimer++;\n                if (this.mouthTimer > 10) {\n                    this.pacman.mouthOpen = !this.pacman.mouthOpen;\n                    this.mouthTimer = 0;\n                }\n            },\n\n            drawWall(x, y) {\n                const px = x * CELL_SIZE;\n                const py = y * CELL_SIZE;\n                const g = this.ctx.createLinearGradient(px, py, px, py + CELL_SIZE);\n                g.addColorStop(0, '#6b88ff');\n                g.addColorStop(1, '#1c2cb8');\n                this.ctx.fillStyle = g;\n                this.ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);\n                this.ctx.strokeStyle = 'rgba(255,255,255,0.15)';\n                this.ctx.strokeRect(px + 0.5, py + 0.5, CELL_SIZE - 1, CELL_SIZE - 1);\n            },\n\n            draw() {\n                this.ctx.save();\n                this.ctx.translate(this.shakeX, this.shakeY);\n\n                this.ctx.fillStyle = PAL.bg;\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                // soft vignette\n                const vg = this.ctx.createRadialGradient(this.canvas.width/2, this.canvas.height/2, 30, this.canvas.width/2, this.canvas.height/2, this.canvas.width*0.8);\n                vg.addColorStop(0, 'rgba(255,230,109,0.04)');\n                vg.addColorStop(1, 'rgba(0,0,0,0.5)');\n                this.ctx.fillStyle = vg;\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n\n                for (let y = 0; y < ROWS; y++) {\n                    for (let x = 0; x < COLS; x++) {\n                        if (this.maze[y][x] === '#') this.drawWall(x, y);\n                    }\n                }\n\n                this.ctx.fillStyle = '#ffd7bc';\n                for (let dot of this.dots) {\n                    this.ctx.fillRect(dot.x * CELL_SIZE + 9, dot.y * CELL_SIZE + 9, 2, 2);\n                }\n\n                // Power pellets w/ glow\n                this.ctx.save();\n                this.ctx.shadowColor = this.powerPelletActive ? PAL.yellow : PAL.pink;\n                this.ctx.shadowBlur = 14;\n                this.ctx.fillStyle = this.powerPelletActive ? PAL.yellow : PAL.pink;\n                for (let pellet of this.powerPellets) {\n                    this.ctx.beginPath();\n                    this.ctx.arc(pellet.x * CELL_SIZE + 10, pellet.y * CELL_SIZE + 10, 4 + Math.sin(this.tick * 0.2) * 1, 0, Math.PI * 2);\n                    this.ctx.fill();\n                }\n                this.ctx.restore();\n\n                // Pac-Man with shadow + lerp\n                this.ctx.save();\n                this.ctx.shadowColor = PAL.yellow;\n                this.ctx.shadowBlur = 14;\n                const cx = this.pacman.renderX * CELL_SIZE + 10;\n                const cy = this.pacman.renderY * CELL_SIZE + 10;\n                const angles = [0, Math.PI, -Math.PI/2, Math.PI/2];\n                const facing = angles[this.pacman.direction];\n                const mouthAngle = this.pacman.mouthOpen ? 0.4 : 0.05;\n                const grad = this.ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 9);\n                grad.addColorStop(0, '#fffbe6');\n                grad.addColorStop(1, PAL.yellow);\n                this.ctx.fillStyle = grad;\n                this.ctx.beginPath();\n                this.ctx.arc(cx, cy, 8, facing + mouthAngle, facing - mouthAngle + Math.PI * 2);\n                this.ctx.lineTo(cx, cy);\n                this.ctx.closePath();\n                this.ctx.fill();\n                this.ctx.restore();\n\n                // Ghosts (rounded body + eyes)\n                for (let ghost of this.ghosts) {\n                    const gx = ghost.renderX * CELL_SIZE + 10;\n                    const gy = ghost.renderY * CELL_SIZE + 10;\n                    const color = this.powerPelletActive ? '#3030ff' : ghost.color;\n                    this.ctx.save();\n                    this.ctx.shadowColor = color;\n                    this.ctx.shadowBlur = 8;\n                    const g = this.ctx.createLinearGradient(gx, gy - 8, gx, gy + 8);\n                    g.addColorStop(0, color);\n                    g.addColorStop(1, this.darken(color, 0.3));\n                    this.ctx.fillStyle = g;\n                    this.ctx.beginPath();\n                    this.ctx.arc(gx, gy - 1, 8, Math.PI, 0);\n                    this.ctx.lineTo(gx + 8, gy + 7);\n                    this.ctx.lineTo(gx + 5, gy + 4);\n                    this.ctx.lineTo(gx + 2, gy + 7);\n                    this.ctx.lineTo(gx - 2, gy + 4);\n                    this.ctx.lineTo(gx - 5, gy + 7);\n                    this.ctx.lineTo(gx - 8, gy + 4);\n                    this.ctx.lineTo(gx - 8, gy - 1);\n                    this.ctx.fill();\n                    // eyes\n                    this.ctx.shadowBlur = 0;\n                    this.ctx.fillStyle = '#fff';\n                    this.ctx.beginPath(); this.ctx.arc(gx - 3, gy - 2, 2.2, 0, Math.PI*2); this.ctx.fill();\n                    this.ctx.beginPath(); this.ctx.arc(gx + 3, gy - 2, 2.2, 0, Math.PI*2); this.ctx.fill();\n                    this.ctx.fillStyle = '#000';\n                    this.ctx.beginPath(); this.ctx.arc(gx - 3, gy - 2, 1.1, 0, Math.PI*2); this.ctx.fill();\n                    this.ctx.beginPath(); this.ctx.arc(gx + 3, gy - 2, 1.1, 0, Math.PI*2); this.ctx.fill();\n                    this.ctx.restore();\n                }\n\n                // Particles\n                for (const p of this.particles) {\n                    this.ctx.globalAlpha = p.life / p.max;\n                    this.ctx.fillStyle = p.color;\n                    this.ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);\n                }\n                this.ctx.globalAlpha = 1;\n\n                // Popups etElementById('level').textContent = this.level;\n                document.getElementById('lives').textContent = this.lives;\n                document.getElementById('dots').textContent = this.dots.length;\n            },\n\n            darken(hex, amt) {\n                if (hex.startsWith('rgb')) return hex;\n                const c = hex.replace('#','');\n                const r = parseInt(c.substr(0,2),16);\n                const g = parseInt(c.substr(2,2),16);\n                const b = parseInt(c.substr(4,2),16);\n                const lr = Math.max(0, Math.round(r * (1 - amt)));\n                const lg = Math.max(0, Math.round(g * (1 - amt)));\n                const lb = Math.max(0, Math.round(b * (1 - amt)));\n                return 'rgb(' + lr + ',' + lg + ',' + lb + ')';\n            },\n\n            drawPause() {\n                this.ctx.fillStyle = 'rgba(0, 0, 40, 0.7)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.fillStyle = PAL.yellow;\n                this.ctx.font = 'bold 28px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.textAlign = 'center';\n                this.ctx.fillText('PAUSED', this.canvas.width / 2, this.canvas.height / 2);\n                this.ctx.textAlign = 'left';\n            },\n\n            drawTitle() {\n                this.ctx.globalAlpha = this.screenAlpha;\n                this.ctx.fillStyle = 'rgba(0, 0, 40, 0.85)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.textAlign = 'center';\n                this.ctx.shadowColor = PAL.yellow;\n                this.ctx.shadowBlur = 20;\n                this.ctx.fillStyle = PAL.yellow;\n                this.ctx.font = 'bold 40px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('PAC-MAN', this.canvas.width/2, 100);\n                this.ctx.shadowBlur = 0;\n                this.ctx.font = 'bold 14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.fillText('DIFFICULTY: ' + this.difficulty.toUpperCase(), this.canvas.width/2, 150);\n                this.ctx.font = '11px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillStyle = PAL.pink;\n                this.ctx.fillText('1=Easy  2=Medium  3=Hard', this.canvas.width/2, 170);\n\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.font = '12px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                const lines = [\n                    'Arrow Keys to move',\n                    'Eat all dots to clear the level',\n                    'Power pellets let you eat ghosts',\n                    'P pause   M mute',\n                    '',\n                    'Press SPACE / ENTER to begin'\n                ];\n                lines.forEach((l, i) => this.ctx.fillText(l, this.canvas.width/2, 210 + i * 20));\n                this.ctx.textAlign = 'left';\n                this.ctx.globalAlpha = 1;\n            },\n\n            drawGameOver() {\n                this.ctx.globalAlpha = this.screenAlpha;\n                this.ctx.fillStyle = 'rgba(0, 0, 40, 0.9)';\n                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);\n                this.ctx.textAlign = 'center';\n                this.ctx.fillStyle = PAL.pink;\n                this.ctx.shadowColor = PAL.pink;\n                this.ctx.shadowBlur = 18;\n                this.ctx.font = 'bold 32px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('GAME OVER', this.canvas.width/2, this.canvas.height/2 - 40);\n                this.ctx.shadowBlur = 0;\n                this.ctx.fillStyle = PAL.yellow;\n                this.ctx.font = 'bold 18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('Final: ' + this.score, this.canvas.width/2, this.canvas.height/2);\n                this.ctx.fillStyle = PAL.cyan;\n                this.ctx.fillText('High: ' + this.highScore, this.canvas.width/2, this.canvas.height/2 + 26);\n                this.ctx.fillStyle = PAL.white;\n                this.ctx.font = '13px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.ctx.fillText('Press ENTER to restart', this.canvas.width/2, this.canvas.height/2 + 60);\n                this.ctx.textAlign = 'left';\n                this.ctx.globalAlpha = 1;\n            },\n\n            setupInput() {\n                document.addEventListener('keydown', (e) => {\n                    if (this.screen === 'title') {\n                        if (e.key === '1') this.setDifficulty(0);\n                        if (e.key === '2') this.setDifficulty(1);\n                        if (e.key === '3') this.setDifficulty(2);\n                        if (e.key === 'Enter' || e.key === ' ') { this.start(); e.preventDefault(); return; }\n                    }\n                    if (this.gameOver && e.key === 'Enter') { this.restart(); return; }\n                    if (e.key.toLowerCase() === 'm') audio.toggleMute();\n\n                    switch(e.key) {\n                        case 'ArrowRight': this.pacman.nextDirection = 0; break;\n                        case 'ArrowLeft': this.pacman.nextDirection = 1; break;\n                        case 'ArrowUp': this.pacman.nextDirection = 2; break;\n                        case 'ArrowDown': this.pacman.nextDirection = 3; break;\n                        case 'p': case 'P': this.gamePaused = !this.gamePaused; break;\n                    }\n                });\n            },\n\n            restart() {\n                this.score = 0;\n                this.level = 1;\n                this.lives = 3;\n                this.gameRunning = false;\n                this.gamePaused = false;\n                this.gameOver = false;\n                this.powerPelletActive = false;\n                this.pacman = { x: 10, y: 15, direction: 0, nextDirection: 0, mouthOpen: true, renderX: 10, renderY: 15 };\n                this.particles = [];\n                this.popups = [];\n                this.tick = 0;\n                this.applyDifficulty();\n                this.createGhosts();\n                this.placeDots();\n                this.screen = 'title';\n                this.screenAlpha = 0;\n                this.draw();\n            },\n\n            gameLoop() {\n                this.update();\n                this.draw();\n                requestAnimationFrame(() => this.gameLoop());\n            }\n        };\n\n        game.init();\n    <\/script>\n</body>\n</html>\n","space-invaders":"<!-- Source: https://github.com/prateek121/90s-games/blob/main/games/space-invaders.html\nMIT License. Copyright (c) 2026 Prateek. Original game source retained. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>SPACE INVADERS - 90s Games</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n            background: linear-gradient(180deg, #020a18 0%, #02030a 100%);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            padding: 20px;\n            color: #c8ffe8;\n        }\n        .container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }\n        canvas#gameCanvas {\n            border: 3px solid #3eea8a;\n            background: #02030a;\n            display: block;\n            box-shadow: 0 0 40px rgba(62, 234, 138, 0.35);\n            border-radius: 4px;\n        }\n        .info { color: #c8ffe8; min-width: 250px; font-family: inherit; }\n        .stat-box {\n            background: rgba(62, 234, 138, 0.08);\n            border: 2px solid #3eea8a;\n            padding: 14px;\n            margin-bottom: 14px;\n            border-radius: 4px;\n        }\n        .stat-label { font-size: 12px; text-transform: uppercase; margin-bottom: 5px; color: #ffd166; letter-spacing: 1px; }\n        .stat-value { font-size: 26px; font-weight: bold; color: #c8ffe8; }\n        button {\n            width: 100%;\n            padding: 10px;\n            background: #3eea8a;\n            color: #02030a;\n            border: 1px solid #3eea8a;\n            font-weight: bold;\n            cursor: pointer;\n            margin: 5px 0;\n            font-family: inherit;\n            border-radius: 4px;\n        }\n        button:hover { background: #ffd166; border-color: #ffd166; }\n        .controls {\n            background: rgba(62, 234, 138, 0.06);\n            border: 2px solid #3eea8a;\n            padding: 10px;\n            font-size: 12px;\n            border-radius: 4px;\n            margin-bottom: 15px;\n            line-height: 1.5;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <canvas id=\"gameCanvas\" width=\"480\" height=\"600\"></canvas>\n        <div class=\"info\">\n            <div class=\"stat-box\"><div class=\"stat-label\">Score</div><div class=\"stat-value\" id=\"score\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">High Score</div><div class=\"stat-value\" id=\"highScore\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Wave</div><div class=\"stat-value\" id=\"wave\">1</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Lives</div><div class=\"stat-value\" id=\"lives\">3</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Enemies</div><div class=\"stat-value\" id=\"enemies\">10</div></div>\n            <div class=\"controls\">\n                <strong>CONTROLS</strong><br/>\n
