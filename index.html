<title>Calculator</title>
<style>
:root{color-scheme:dark;--orange:#ff9f0a;--panel:#171717;--muted:#a5a5a5}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Fredoka",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:16px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.calculator{width:min(100%,390px);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(9px,2vh,16px)}
.display{height:clamp(120px,27vh,220px);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 12px;overflow:hidden}
#screen{width:100%;text-align:right;white-space:nowrap;overflow:hidden;font-size:clamp(48px,14vw,76px);font-weight:300;letter-spacing:-3px;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.3vw,13px)}
.key{appearance:none;border:0;border-radius:50%;aspect-ratio:1;background:#292929;color:#fff;font-size:clamp(22px,6vw,30px);font-weight:400;display:grid;place-items:center;min-width:0;transition:filter .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.key:active{filter:brightness(1.25)}
.utility{background:#a5a5a5;color:#000}
.operator{background:var(--orange);color:#fff;font-size:clamp(27px,7vw,36px)}
.operator.selected{background:#fff;color:var(--orange)}
.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;justify-content:start;padding-left:calc(25% - 8px)}
.overlay{position:fixed;inset:0;z-index:5;background:#000e;display:none;place-items:center;padding:18px}
.overlay.open{display:grid}
.dialog{width:min(100%,520px);max-height:min(88dvh,850px);overflow:auto;background:#111;border:1px solid #303030;border-radius:22px;padding:22px;box-shadow:0 24px 80px #000}
.dialog h1{font-size:21px;margin:0 0 8px}
.dialog p{color:#aaa;font-size:14px;line-height:1.5;margin:0 0 16px}
.code-display{height:54px;border-radius:12px;background:#050505;border:1px solid #333;display:grid;place-items:center;font-size:25px;letter-spacing:9px;margin:14px 0}
.code-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.code-grid button,.secondary{border:1px solid #333;background:#222;color:#fff;border-radius:12px;padding:14px;font-size:18px}
.code-grid button:active,.secondary:active{background:#444}
.dialog-actions{display:flex;gap:10px;margin-top:14px}
.dialog-actions button{flex:1}
.secondary{font-size:14px;padding:12px}
.error{color:#ff7777!important;min-height:18px}#loadProgress{font-size:12px;color:#aaa;min-height:18px;margin-top:6px}#loadProgressTrack{height:4px;background:#292929;border-radius:99px;overflow:hidden;margin-top:7px;display:none}#loadProgressBar{height:100%;width:0;background:var(--orange);transition:width .15s linear}
.school{width:min(100%,900px)}
.school.fullscreen{position:fixed;inset:0;width:100%;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column}
.school.fullscreen .source{max-height:24dvh}
.url-row{display:flex;gap:8px}
.url-row input,.url-row select{min-width:0;background:#050505;color:white;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.url-row input{flex:1}.preset-row{display:flex;gap:8px;margin-top:10px}.preset-row select{flex:1;min-width:0;background:#050505;color:#fff;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.preset-row button{white-space:nowrap}.school.fullscreen .preset-row{flex-shrink:0}
.primary{background:var(--orange);color:#111;border:0;border-radius:11px;padding:12px 16px;font-weight:700}
.source{display:none;white-space:pre;overflow:auto;user-select:text;-webkit-user-select:text;max-height:48dvh;background:#050505;border:1px solid #333;border-radius:12px;padding:14px;font:12px/1.5 "Fredoka",sans-serif;color:#ddd;margin-top:14px;tab-size:2}
#acCounter{position:absolute;top:10px;left:12px;color:#ff9f0a;font-size:12px;letter-spacing:.5px;display:none}
body.light-mode,body.light-mode .overlay{background:#f4f4f4;color:#111}
body.light-mode .key{background:#dedede;color:#111}
body.light-mode .utility{background:#bcbcbc;color:#111}
body.light-mode .operator{background:#ff9f0a;color:#fff}
body.light-mode .dialog{background:#fff;color:#111;border-color:#ccc}
body.light-mode .dialog p{color:#555}
body.light-mode .source{background:#f4f4f4;color:#222;border-color:#ccc}
body.light-mode .url-row input,body.light-mode .url-row select,body.light-mode .preset-row select{background:#fff;color:#111;border-color:#ccc}
@media(min-width:500px){.calculator{width:360px}.keys{gap:12px}.key{font-size:28px}}

.catalog-overlay{z-index:20;padding:12px}.catalog-dialog{width:min(100%,1120px);height:min(94dvh,940px);max-height:94dvh;display:flex;flex-direction:column;gap:14px;padding:clamp(16px,3vw,28px);overflow:hidden}
.website-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:26px}.website-choice{min-height:190px;border:1px solid #333;border-radius:18px;background:linear-gradient(145deg,#20202a,#101014);color:#fff;text-align:left;padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:9px;transition:transform .16s,border-color .16s,background .16s}.website-choice:active{transform:scale(.98)}.website-choice:hover{border-color:#ff9f0a;background:linear-gradient(145deg,#292936,#15151b)}.website-icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#ff9f0a;color:#111;font-size:27px;font-weight:700}.mystars-choice .website-icon{background:#a78bfa;color:#100c1c}.website-name{font-size:22px;font-weight:700;margin-top:12px}.website-url{font-size:13px;color:#aaa}@media(max-width:520px){.website-choices{grid-template-columns:1fr}.website-choice{min-height:145px}.website-name{margin-top:3px}}.catalog-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.catalog-kicker{font-size:10px;letter-spacing:2px;color:#ff9f0a;font-weight:700}.catalog-heading h1{font-size:clamp(25px,4vw,34px);margin:4px 0}.catalog-heading p{margin:0!important;max-width:650px}.catalog-close{flex:0 0 auto;width:42px;height:42px;padding:8px}
.catalog-categories{display:flex;gap:7px;flex-wrap:wrap}.catalog-categories button{border:1px solid #353535;background:#1a1a1a;color:#bbb;padding:8px 13px;border-radius:999px;font-size:13px}.catalog-categories button.active{background:#ff9f0a;color:#111;border-color:#ff9f0a;font-weight:700}
.catalog-meta{display:flex;justify-content:space-between;gap:10px;color:#999;font-size:12px}.catalog-meta strong{color:#fff}.catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;overflow:auto;min-height:0;flex:1;padding:2px}
.catalog-card{background:#171717;border:1px solid #303030;border-radius:15px;padding:13px;display:flex;flex-direction:column;min-height:150px}.catalog-card-top{display:flex;justify-content:space-between;align-items:center}.catalog-tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#ffb84d}.catalog-license{font-size:10px;color:#7ad69a;border:1px solid #285b3a;border-radius:99px;padding:3px 7px}.catalog-card h3{font-size:17px;margin:12px 0 4px}.catalog-card p{font-size:11px!important;color:#888!important;margin:0 0 12px!important}.catalog-load{margin-top:auto;background:#262626;border:1px solid #444;border-radius:9px;color:#fff;padding:9px;font-size:12px;font-weight:600}.catalog-load:active{background:#ff9f0a;color:#111}
.catalog-pagination{display:flex;align-items:center;justify-content:center;gap:16px}.catalog-pagination button{padding:9px 13px}.catalog-pagination button:disabled{opacity:.35;cursor:not-allowed}.catalog-pagination span{font-size:12px;color:#aaa;min-width:90px;text-align:center}.catalog-footnote{font-size:11px!important;color:#777!important;margin:0!important}
@media(max-width:600px){.catalog-dialog{height:96dvh;max-height:96dvh;padding:14px}.catalog-heading p{font-size:12px}.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.catalog-card{padding:10px;min-height:140px}.catalog-card h3{font-size:14px}.catalog-card p{font-size:10px!important}.catalog-load{font-size:11px;padding:8px}.catalog-categories{gap:5px}.catalog-categories button{padding:7px 10px;font-size:11px}}

.catalog-dialog{background:#101014;border:1px solid #282832}
.catalog-heading{align-items:center}
.catalog-heading h1{font-size:clamp(30px,5vw,42px);letter-spacing:-1px}
.catalog-kicker{color:#ffb12b}
.catalog-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px}
.catalog-card{padding:0;overflow:hidden;min-height:224px;background:#19191f;border:1px solid #30303a;border-radius:17px;transition:transform .18s,border-color .18s,box-shadow .18s}
.catalog-card:hover{transform:translateY(-4px);border-color:#68606e;box-shadow:0 12px 30px #0008}
.game-art{height:124px;display:grid;place-items:center;position:relative;overflow:hidden;background:#171722}.game-art img{width:100%;height:100%;object-fit:cover;display:block}
.game-art:before,.game-art:after{content:"";position:absolute;border-radius:50%;filter:blur(1px);opacity:.28;pointer-events:none}
.game-art:before{width:130px;height:130px;background:#fff;top:-75px;right:-15px}
.game-art:after{width:90px;height:90px;background:#fff;bottom:-58px;left:-5px}
.game-art span{position:relative;z-index:1;filter:drop-shadow(0 8px 8px #0008);transform:rotate(-7deg);transition:transform .2s}
.catalog-card:hover .game-art img{transform:scale(1.06)}.game-art img{transition:transform .2s}
.game-card-info{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
.catalog-card h3{font-size:16px;margin:0 0 8px}
.catalog-card p{font-size:11px!important;color:#999!important;margin:0 0 10px!important}
.catalog-tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#c9c3d0}
.catalog-license{display:none}
.catalog-load{background:#292933;border:1px solid #41414e;border-radius:10px;color:#fff;padding:10px;font-size:12px;font-weight:700}
.catalog-load:active,.catalog-load:hover{background:#ff9f0a;color:#111;border-color:#ff9f0a}
.catalog-categories button{background:#22222a;border-color:#383842;color:#d0d0d8}
.catalog-categories button.active{background:#ff9f0a;color:#111}
.catalog-meta strong{color:#fff}
@media(max-width:600px){.catalog-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.game-art{height:105px;font-size:52px}.catalog-card{min-height:196px}.game-card-info{padding:9px}.catalog-card h3{font-size:14px}}

</style>

<body>
<main class="calculator" aria-label="Calculator">
  <div class="display"><output id="screen" aria-live="polite">0</output></div>
  <div class="keys" id="keys">
    <button class="key utility" id="clearKey" data-action="clear">AC</button>
    <button class="key utility" data-action="sign">+/−</button>
    <button class="key utility" data-action="percent">%</button>
    <button class="key operator" data-op="÷">÷</button>
    <button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×">×</button>
    <button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−">−</button>
    <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+">+</button>
    <button class="key" data-action="backspace" aria-label="Backspace" title="Backspace">←</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key operator" data-action="equals">=</button>
  </div>
</main>

<section class="overlay" id="codeOverlay" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
 <div class="dialog">
  <h1 id="codeTitle">Enter access code</h1>
  <p>Enter the four-digit code to continue.</p>
  <div class="code-display" id="codeDisplay" aria-live="polite">• • • •</div>
  <div class="code-grid" id="codeKeys">
   <button data-code="1">1</button><button data-code="2">2</button><button data-code="3">3</button>
   <button data-code="4">4</button><button data-code="5">5</button><button data-code="6">6</button>
   <button data-code="7">7</button><button data-code="8">8</button><button data-code="9">9</button>
   <button data-code="clear">Clear</button><button data-code="0">0</button><button data-code="back">⌫</button>
  </div>
  <p class="error" id="codeError"></p>
  <div class="dialog-actions"><button class="secondary" id="cancelCode">Cancel</button><button class="primary" id="submitCode">Unlock</button></div>
 </div>
</section>

<section id="schoolOverlay" style="display:none" aria-hidden="true">
<input id="siteUrl" type="hidden" value="">
<select id="gamePreset"><option value="https://playswiper.com/">Swiper</option><option value="https://www.mystarsnight.com/home">Mystarsnight</option></select>
<button id="loadSource" type="button">Open</button>
<button id="runCode" type="button">Play</button>
<button id="fullScreen" type="button">Full Screen</button>
<button id="copySource" type="button">Copy</button>
<button id="exitSchool" type="button">Exit</button>
<div id="sourceError"></div><div id="loadProgress"></div><div id="loadProgressTrack"><div id="loadProgressBar"></div></div>
<pre id="sourceOutput"></pre>
</section>




<section class="overlay catalog-overlay" id="catalogOverlay" role="dialog" aria-modal="true" aria-labelledby="catalogTitle">
 <div class="dialog catalog-dialog">
  <div class="catalog-heading"><div><div class="catalog-kicker">YOUR WEBSITES</div><h1 id="catalogTitle">Choose a website</h1><p>Pick one to open it in a new full-screen tab.</p></div><button class="secondary catalog-close" id="catalogClose" type="button" aria-label="Close menu">✕</button></div>
  <div class="website-choices">
   <button class="website-choice swiper-choice" type="button" data-site="https://playswiper.com/"><span class="website-icon">↗</span><span class="website-name">Swiper</span><span class="website-url">playswiper.com</span></button>
   <button class="website-choice mystars-choice" type="button" data-site="https://www.mystarsnight.com/home"><span class="website-icon">✦</span><span class="website-name">Mystarsnight</span><span class="website-url">mystarsnight.com/home</span></button>
  </div>
 </div>
</section>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const screen=$('screen'),keys=$('keys');
let value='0',stored=null,operator=null,waiting=false,finished=false;
let warmup=0,warmupAt=0,armed=false,acCount=0,schoolUnlocked=false;
let lightEquals=0,lightStage='equals',lightDigits='',patternIndex=0,patternAt=0;
let lastBaseUrl='';
const format=n=>Number.isFinite(n)?String(Number(n.toPrecision(11))):'Error';
function render(){
 let shown=value;
 if(shown.length>11&&shown!=='Error')shown=Number(shown).toExponential(5);
 screen.textContent=shown;
 keys.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('selected',waiting&&b.dataset.op===operator));
}
function inputDigit(d){
 if(secretDigit(d))return;
 if(value==='Error'||waiting||finished){value=d;waiting=false;finished=false;}
 else if(value.replace('-','').length<14)value=value==='0'?d:value+d;
 render();
}
function inputDecimal(){
 if(value==='Error'||waiting||finished){value='0.';waiting=false;finished=false;}
 else if(!value.includes('.'))value+='.';
 render();
}
function calculate(a,b,op){
 switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;default:return b;}
}
function chooseOperator(next){
 const n=Number(value);if(!Number.isFinite(n))return;
 if(operator&&!waiting){stored=calculate(stored,n,operator);value=format(stored);}
 else stored=n;
 operator=next;waiting=true;finished=false;render();
}
function equals(){
 if(secretEquals())return;
 if(!operator||stored===null||waiting)return;
 value=format(calculate(stored,Number(value),operator));
 stored=null;operator=null;waiting=true;finished=true;render();
}
function clearTap(){
 value='0';stored=null;operator=null;waiting=false;finished=false;
 if(!schoolUnlocked){
  const now=Date.now();
  if(!armed){
   if(!warmup||now-warmupAt>10000){warmup=0;warmupAt=now;}
   warmup++;
   if(warmup>=10){armed=true;acCount=0;}
  }else{
   acCount++;
   if(acCount>=100){schoolUnlocked=true;openCatalog();}
  }
  if(armed&&!schoolUnlocked)value=String(acCount);
 }
 render();
}
function action(name){
 if(name==='clear')return clearTap();
 if(name==='sign'&&value!=='0'&&value!=='Error')value=value.startsWith('-')?value.slice(1):'-'+value;
 else if(name==='percent'&&value!=='Error')value=format(Number(value)/100);
 else if(name==='decimal')return inputDecimal();
 else if(name==='backspace'&&!waiting&&!finished&&value!=='Error')value=value.length<=1||(value.length===2&&value[0]==='-')?'0':value.slice(0,-1);
 else if(name==='equals')return equals();
 render();
}
function secretDigit(d){
 if(lightStage==='number'){
  lightDigits+=d;screen.textContent=lightDigits;
  if(lightDigits.length===4){
   if(lightDigits==='1000'){lightStage='pattern';patternIndex=0;patternAt=Date.now();lightDigits='';}
   else{lightDigits='';value='0';screen.textContent='0';}
  }
  return true;
 }
 if(lightStage==='pattern'){
  const expected=patternIndex%2===0?'6':'7';
  if(Date.now()-patternAt>8000||d!==expected){patternIndex=d==='6'?1:0;patternAt=Date.now();lightDigits=d;screen.textContent=d;return true;}
  patternIndex++;lightDigits+=d;screen.textContent=lightDigits;
  if(patternIndex>=16){lightStage='done';document.body.classList.add('light-mode');}
  return true;
 }
 return false;
}
function secretEquals(){
 if(lightStage!=='equals')return false;
 lightEquals++;
 if(lightEquals>=5){lightStage='number';lightDigits='';}
 return true;
}
// Bind each calculator key directly. This avoids relying on event bubbling/delegation on mobile browsers.
keys.querySelectorAll('button').forEach(button=>{
 button.addEventListener('click',()=>{
  if(button.dataset.digit!==undefined)inputDigit(button.dataset.digit);
  else if(button.dataset.op)chooseOperator(button.dataset.op);
  else if(button.dataset.action)action(button.dataset.action);
 });
});
document.addEventListener('keydown',e=>{
 if(/^[0-9]$/.test(e.key))inputDigit(e.key);
 else if(e.key==='.'||e.key===',')inputDecimal();
 else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();}
 else if(e.key==='Escape'||e.key==='Delete')clearTap();
 else if(e.key==='Backspace')action('backspace');
 else if(({'+':1,'-':1,'*':1,'/':1})[e.key])chooseOperator(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);
 else if(e.key==='%')action('percent');
});
['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});



const siteInput=$('siteUrl');
const catalogOverlay=$('catalogOverlay');
function openCatalog(){catalogOverlay.classList.add('open');}
function closeCatalog(){catalogOverlay.classList.remove('open');}
function openWebsite(url){
 const tab=window.open('about:blank','_blank');
 if(!tab){$('sourceError').textContent='Allow pop-ups to open this website.';return;}
 closeCatalog();
 try{tab.location.replace(url);tab.focus();}
 catch(error){tab.location.href=url;tab.focus();}
}
$('openGameCatalog').addEventListener('click',openCatalog);
$('catalogClose').addEventListener('click',closeCatalog);
catalogOverlay.addEventListener('click',e=>{if(e.target===catalogOverlay)closeCatalog();});
catalogOverlay.querySelectorAll('[data-site]').forEach(button=>button.addEventListener('click',()=>openWebsite(button.dataset.site)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&catalogOverlay.classList.contains('open'))closeCatalog();});
const preset=$('gamePreset');
preset.addEventListener('change',()=>{siteInput.value=preset.value||'';});
$('loadSource').addEventListener('click',()=>{
 if(!preset.value){$('sourceError').textContent='Choose a website first.';return;}
 siteInput.value=preset.value;loadSource();
});
async function readWithProgress(response){
 const progress=$('loadProgress'),track=$('loadProgressTrack'),bar=$('loadProgressBar');
 const total=Number(response.headers.get('content-length'))||0,start=Date.now();
 if(!response.body?.getReader){progress.textContent='Downloading… remaining time unavailable';return response.text();}
 const reader=response.body.getReader(),chunks=[];let received=0;
 while(true){
  const part=await reader.read();if(part.done)break;
  chunks.push(part.value);received+=part.value.length;
  if(total>0){
   const elapsed=Math.max((Date.now()-start)/1000,.1),remaining=(total-received)/(received/elapsed);
   const pct=Math.min(100,received/total*100);
   progress.textContent='Downloading '+Math.round(pct)+'% · '+(remaining<1?'less than 1 second':Math.ceil(remaining)+' seconds remaining');
   track.style.display='block';bar.style.width=pct+'%';
  }else{progress.textContent='Downloading… remaining time unavailable (server hides file size)';track.style.display='block';}
 }
 return new Blob(chunks).text();
}
async function loadSource(){
 const error=$('sourceError'),output=$('sourceOutput'),button=$('loadSource'),progress=$('loadProgress'),track=$('loadProgressTrack'),bar=$('loadProgressBar');
 let url;
 try{
  const raw=siteInput.value.trim();if(!raw)throw new Error('Enter a website address first.');
  url=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)?raw:'https://'+raw);
  if(!['http:','https:'].includes(url.protocol))throw new Error('Only HTTP and HTTPS addresses are supported.');
 }catch(err){error.textContent=err.message;return;}
 error.textContent='';output.textContent='';progress.textContent='Connecting…';track.style.display='none';bar.style.width='0';
 button.disabled=true;button.textContent='Open Website';
 try{
  let response=null;const errors=[];
  const attempts=[
   ['Direct',url.href,'direct'],
   ['cors.dev','https://proxy.cors.dev/'+url.href,'proxy'],
   ['AllOrigins','https://api.allorigins.win/raw?url='+encodeURIComponent(url.href),'proxy'],
   ['ThingProxy','https://thingproxy.freeboard.io/fetch/'+url.href,'proxy']
  ];
  for(const [label,endpoint,kind] of attempts){
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(new Error('Request timed out after 18 seconds')),18000);
   try{
    progress.textContent='Getting things ready…';
    const candidate=await fetch(endpoint,{mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal,cache:'no-store'});
    if(!candidate.ok)throw new Error('HTTP '+candidate.status);
    const length=Number(candidate.headers.get('content-length'))||0;
    if(length>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
    response=candidate;lastBaseUrl=kind==='direct'?(candidate.url||url.href):url.href;
    window.clearTimeout(timeout);
    break;
   }catch(err){window.clearTimeout(timeout);controller.abort();errors.push(label+': '+(err.message||'request failed'));}
  }
  if(!response)throw new Error(errors.join(' | '));
  const source=await readWithProgress(response);
  if(new Blob([source]).size>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
  if(!source.trim())throw new Error('The server returned an empty page.');
  output.textContent=source;
  if(!lastBaseUrl)lastBaseUrl=url.href;
  progress.textContent='Ready!';
 }catch(err){
  error.textContent='Could not load game: '+err.message;
  progress.textContent='';
 }finally{button.disabled=false;button.textContent='Loading…';}
}
async function runLoadedSource(){
 const source=$('sourceOutput').textContent,status=$('sourceError');
 if(!source.trim()){status.textContent='Pick a game first.';return;}
 const tab=window.open('about:blank','_blank');
 if(!tab){status.textContent='Allow pop-ups to open the game.';return;}
 try{
  const baseUrl=lastBaseUrl||siteInput.value.trim();
  const base=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(baseUrl)?baseUrl:'https://'+baseUrl);
  const parsed=new DOMParser().parseFromString(source,'text/html');
  const target=tab.document;
  const root=target.documentElement;
  for(const attr of [...parsed.documentElement.attributes])root.setAttribute(attr.name,attr.value);
  root.innerHTML=parsed.documentElement.innerHTML;
  target.title=parsed.title||base.hostname;
  const baseTag=target.createElement('base');
  baseTag.href=base.href;
  target.head.insertBefore(baseTag,target.head.firstChild);
  target.documentElement.style.cssText='min-height:100%;';
  target.body.style.minHeight='100vh';
  const inertScripts=[...target.querySelectorAll('script')];
  for(const inert of inertScripts){
   if(!inert.isConnected)continue;
   const live=target.createElement('script');
   for(const attr of [...inert.attributes])live.setAttribute(attr.name,attr.value);
   if(!inert.hasAttribute('async'))live.async=false;
   live.textContent=inert.textContent;
   const waitForLoad=live.src&&!live.async?new Promise(resolve=>{
    live.addEventListener('load',resolve,{once:true});
    live.addEventListener('error',resolve,{once:true});
   }):null;
   inert.replaceWith(live);
   if(waitForLoad)await Promise.race([waitForLoad,new Promise(resolve=>setTimeout(resolve,12000))]);
  }
  tab.focus();
  status.textContent='Game opened in a new tab.';
 }catch(err){status.textContent='Could not open game: '+(err.message||String(err));}
}
$('runCode').addEventListener('click',runLoadedSource);
$('exitSchool').addEventListener('click',()=>$('schoolOverlay').classList.remove('open'));
$('fullScreen').addEventListener('click',async()=>{
 const panel=document.querySelector('#schoolOverlay .school');
 try{if(document.fullscreenElement){await document.exitFullscreen();panel.classList.remove('fullscreen');}
 else{await panel.requestFullscreen();panel.classList.add('fullscreen');}}
 catch(err){$('sourceError').textContent='Full screen unavailable: '+err.message;}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.querySelector('#schoolOverlay .school').classList.remove('fullscreen');});
$('copySource').addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText($('sourceOutput').textContent);$('sourceError').textContent='Copied.';}
 catch(err){$('sourceError').textContent='Copy unavailable: '+err.message;}
});
render();
window.addEventListener('error',e=>{const box=$('sourceError');if(box)box.textContent='App error: '+(e.message||'Unknown JavaScript error');});
window.addEventListener('unhandledrejection',e=>{const box=$('sourceError');if(box)box.textContent='App error: '+(e.reason?.message||String(e.reason));});
})();
