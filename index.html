<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Calculator</title>
<style>
:root{color-scheme:dark;--orange:#ff9f0a;--panel:#171717;--muted:#a5a5a5}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Fredoka",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:16px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.calculator{width:min(100%,390px);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(9px,2vh,16px)}
.display{height:clamp(120px,27vh,220px);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 12px;overflow:hidden}
#screen{width:100%;text-align:right;white-space:nowrap;overflow:hidden;font-size:clamp(48px,14vw,76px);font-weight:300;letter-spacing:-3px;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.3vw,13px)}
.key{appearance:none;border:0;border-radius:50%;aspect-ratio:1;background:#292929;color:#fff;font-size:clamp(22px,6vw,30px);font-weight:400;display:grid;place-items:center;min-width:0;transition:filter .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.key:active{filter:brightness(1.45);transform:scale(.94)}
.utility{background:#a5a5a5;color:#000}
.operator{background:var(--orange);color:#fff;font-size:clamp(27px,7vw,36px)}
.operator.selected{background:#fff;color:var(--orange)}
.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;justify-content:start;padding-left:calc(25% - 8px)}
.overlay{position:fixed;inset:0;z-index:5;background:#000e;display:none;place-items:center;padding:18px}
.overlay.open{display:grid}
.dialog{width:min(100%,520px);max-height:min(88dvh,850px);overflow:auto;background:#111;border:1px solid #303030;border-radius:22px;padding:22px;box-shadow:0 24px 80px #000}
.dialog h1{font-size:21px;margin:0 0 8px}
.dialog p{color:#aaa;font-size:14px;line-height:1.5;margin:0 0 16px}
.code-display{height:54px;border-radius:12px;background:#050505;border:1px solid #333;display:grid;place-items:center;font-size:25px;letter-spacing:9px;margin:14px 0}
.code-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.code-grid button,.secondary{border:1px solid #333;background:#222;color:#fff;border-radius:12px;padding:14px;font-size:18px}
.code-grid button:active,.secondary:active{background:#444}
.dialog-actions{display:flex;gap:10px;margin-top:14px}
.dialog-actions button{flex:1}
.secondary{font-size:14px;padding:12px}
.error{color:#ff7777!important;min-height:18px}
.school{width:min(100%,900px)}
.school.fullscreen{position:fixed;inset:0;width:100%;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column}
.school.fullscreen .source{max-height:24dvh}
.url-row{display:flex;gap:8px}
.url-row input,.url-row select{min-width:0;background:#050505;color:white;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.url-row input{flex:1}.preset-row{display:flex;gap:8px;margin-top:10px}.preset-row select{flex:1;min-width:0;background:#050505;color:#fff;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.preset-row button{white-space:nowrap}.school.fullscreen .preset-row{flex-shrink:0}
.primary{background:var(--orange);color:#111;border:0;border-radius:11px;padding:12px 16px;font-weight:700}
.source{white-space:pre;overflow:auto;max-height:48dvh;background:#050505;border:1px solid #333;border-radius:12px;padding:14px;font:12px/1.5 "Fredoka",sans-serif;color:#ddd;margin-top:14px;tab-size:2}
#acCounter{position:absolute;top:10px;left:12px;color:#ff9f0a;font-size:12px;letter-spacing:.5px;display:none}
body.light-mode,body.light-mode .overlay{background:#f4f4f4;color:#111}
body.light-mode .key{background:#dedede;color:#111}
body.light-mode .utility{background:#bcbcbc;color:#111}
body.light-mode .operator{background:#ff9f0a;color:#fff}
body.light-mode .dialog{background:#fff;color:#111;border-color:#ccc}
body.light-mode .dialog p{color:#555}
body.light-mode .source{background:#f4f4f4;color:#222;border-color:#ccc}
body.light-mode .url-row input,body.light-mode .url-row select,body.light-mode .preset-row select{background:#fff;color:#111;border-color:#ccc}
@media(min-width:500px){.calculator{width:360px}.keys{gap:12px}.key{font-size:28px}}
</style>
</head>
<body>
<main class="calculator" aria-label="Calculator">
  <div class="display"><output id="screen" aria-live="polite">0</output></div>
  <div class="keys" id="keys">
    <button class="key utility" id="clearKey" data-action="clear">AC</button>
    <button class="key utility" data-action="sign">+/−</button>
    <button class="key utility" data-action="percent">%</button>
    <button class="key operator" data-op="÷">÷</button>
    <button class="key" data-digit="7">7</button><button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button><button class="key operator" data-op="×">×</button>
    <button class="key" data-digit="4">4</button><button class="key" data-digit="5">5</button><button class="key" data-digit="6">6</button><button class="key operator" data-op="−">−</button>
    <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button><button class="key" data-digit="3">3</button><button class="key operator" data-op="+">+</button>
    <button class="key" data-action="backspace" aria-label="Backspace" title="Backspace">←</button><button class="key zero" data-digit="0">0</button><button class="key" data-action="decimal">.</button><button class="key operator" data-action="equals">=</button>
  </div>
</main>

<section class="overlay" id="codeOverlay" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
 <div class="dialog">
  <h1 id="codeTitle">Enter access code</h1>
  <p>Enter the four-digit code to continue.</p>
  <div class="code-display" id="codeDisplay" aria-live="polite">• • • •</div>
  <div class="code-grid" id="codeKeys">
   <button data-code="1">1</button><button data-code="2">2</button><button data-code="3">3</button>
   <button data-code="4">4</button><button data-code="5">5</button><button data-code="6">6</button>
   <button data-code="7">7</button><button data-code="8">8</button><button data-code="9">9</button>
   <button data-code="clear">Clear</button><button data-code="0">0</button><button data-code="back">⌫</button>
  </div>
  <p class="error" id="codeError"></p>
  <div class="dialog-actions"><button class="secondary" id="cancelCode">Cancel</button><button class="primary" id="submitCode">Unlock</button></div>
 </div>
</section>

<section class="overlay" id="schoolOverlay" role="dialog" aria-modal="true" aria-labelledby="schoolTitle">
 <div class="dialog school">

  <form class="url-row" id="sourceForm">
   <input id="siteUrl" type="text" placeholder="https://example.com" autocomplete="url" inputmode="url">
   <button class="primary" type="submit" id="loadSource">Load Source</button>
  </form>
  <div class="preset-row">
   <select id="gamePreset" aria-label="Choose a game website">
    <option value="">Choose a game website…</option>
    <option value="https://www.coolmathgames.com/">Coolmath Games</option>
    <option value="https://www.crazygames.com/">CrazyGames</option>
    <option value="https://poki.com/">Poki</option>
    <option value="https://www.y8.com/">Y8 Games</option>
    <option value="https://www.miniclip.com/">Miniclip</option>
    <option value="https://www.kongregate.com/">Kongregate</option>
    <option value="https://itch.io/games">itch.io</option>
    <option value="https://www.newgrounds.com/games">Newgrounds</option>
    <option value="https://www.gamepix.com/">GamePix</option>
    <option value="https://www.armorgames.com/">Armor Games</option>
    <option value="https://www.addictinggames.com/">Addicting Games</option>
    <option value="https://www.friv.com/">Friv</option>
    <option value="https://www.gamesgames.com/">GamesGames</option>
    <option value="https://www.primarygames.com/">PrimaryGames</option>
    <option value="https://scratch.mit.edu/explore/projects/games/">Scratch Games</option>
    <option value="https://www.pbskids.org/games/">PBS Kids Games</option>
    <option value="https://www.funbrain.com/games">Funbrain</option>
    <option value="https://www.mathplayground.com/">Math Playground</option>
    <option value="https://mathkit.org/">MathKit.org — Hidden Classroom Games</option>
   </select>
   <button class="primary" id="loadAndRun" type="button">Load + Run</button>
  </div>
  <p class="error" id="sourceError" style="margin-top:12px"></p>
  <pre class="source" id="sourceOutput"></pre>
  <div class="dialog-actions">
   <button class="secondary" id="runCode" type="button">Run Code</button>
   <button class="secondary" id="fullScreen" type="button">Full Screen</button>
   <button class="secondary" id="copySource" type="button">Copy</button>
   <button class="secondary" id="exitSchool" type="button">Exit</button>
  </div>
 </div>
</section>



<script>
(()=>{
const screen=document.getElementById('screen'),keys=document.getElementById('keys');
let value='0',stored=null,op=null,waiting=false,done=false;
const fmt=n=>Number.isFinite(n)?String(Number(n.toPrecision(11))):'Error';
function draw(){let s=value;if(s.length>11&&s!=='Error')s=Number(s).toExponential(5);screen.textContent=s;keys.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('selected',waiting&&b.dataset.op===op))}
function digit(d){if(secretDigit(d))return;if(value==='Error'||waiting||done){value=d;waiting=false;done=false}else if(value.replace('-','').length<14)value=value==='0'?d:value+d;draw()}
function decimal(){if(value==='Error'||waiting||done){value='0.';waiting=false;done=false}else if(!value.includes('.'))value+='.';draw()}
function calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?(b===0?NaN:a/b):b}
function choose(o){let n=Number(value);if(!Number.isFinite(n))return;if(op&&!waiting){stored=calc(stored,n,op);value=fmt(stored)}else stored=n;op=o;waiting=true;done=false;draw()}
function equal(){if(secretEquals())return;if(!op||stored===null||waiting)return;value=fmt(calc(stored,Number(value),op));stored=null;op=null;waiting=true;done=true;draw()}
function action(a){if(a==='clear'){value='0';stored=null;op=null;waiting=false;done=false}
else if(a==='sign'&&value!=='0'&&value!=='Error')value=value.startsWith('-')?value.slice(1):'-'+value;
else if(a==='percent'&&value!=='Error')value=fmt(Number(value)/100);
else if(a==='decimal')return decimal();
else if(a==='backspace'&&!waiting&&!done&&value!=='Error')value=value.length<=1||(value.length===2&&value[0]==='-')?'0':value.slice(0,-1);
else if(a==='equals')return equal();draw()}
keys.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined)digit(b.dataset.digit);else if(b.dataset.op)choose(b.dataset.op);else if(b.dataset.action)action(b.dataset.action)});
document.addEventListener('keydown',e=>{if(document.getElementById('codeOverlay').classList.contains('open')){if(/^[0-9]$/.test(e.key))addCode(e.key);else if(e.key==='Backspace')addCode('back');else if(e.key==='Enter')unlock();else if(e.key==='Escape')closeCode();return}if(/^[0-9]$/.test(e.key))digit(e.key);else if(e.key==='.'||e.key===',')decimal();else if(e.key==='Enter'||e.key==='='){e.preventDefault();equal()}else if(e.key==='Escape'||e.key==='Delete')action('clear');else if(e.key==='Backspace')action('backspace');else if(({'+':1,'-':1,'*':1,'/':1})[e.key])choose(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);else if(e.key==='%')action('percent')});
draw();

// Hidden School Mode unlock: 10 AC taps within 10 seconds, then 100 additional AC taps.
const clearKey=document.getElementById('clearKey');
let acWarmup=0,acWarmupStart=0,acCount=0,schoolArmed=false,schoolUnlocked=false;
function handleAcTap(){
 const now=Date.now();
 if(schoolUnlocked)return;
 if(!schoolArmed){
  if(!acWarmup||now-acWarmupStart>10000){acWarmup=0;acWarmupStart=now}
  acWarmup++;
  if(acWarmup>=10){schoolArmed=true;acCount=0;}
  return;
 }
 acCount++;
 if(acCount>=100){
  schoolUnlocked=true;
  document.getElementById('schoolOverlay').classList.add('open');
 }
}

// Hidden light-mode sequence. No progress counters or on-screen clues are shown.
let hintEquals=0,hintStage='equals',hintNumber='',hintPatternIndex=0,hintPatternStarted=0;
function secretDigit(d){
 if(hintStage==='number'){
  hintNumber+=d;
  screen.textContent=hintNumber;
  if(hintNumber.length>=4){
   if(hintNumber==='1000'){
    hintStage='pattern';hintPatternIndex=0;hintPatternStarted=Date.now();
    hintNumber='';
   }else{
    hintNumber='';screen.textContent='0';
   }
  }
  return true;
 }
 if(hintStage==='pattern'){
  const expected=hintPatternIndex%2===0?'6':'7';
  if(Date.now()-hintPatternStarted>8000||d!==expected){
   hintPatternIndex=d==='6'?1:0;
   hintPatternStarted=Date.now();
   hintNumber=d;
   screen.textContent=hintNumber;
   return true;
  }
  hintPatternIndex++;
  hintNumber+=d;
  screen.textContent=hintNumber;
  if(hintPatternIndex>=16){
   hintStage='done';
   document.body.classList.add('light-mode');
  }
  return true;
 }
 return false;
}
function secretEquals(){
 if(hintStage!=='equals')return false;
 hintEquals++;
 if(hintEquals>=5){
  hintStage='number';hintNumber='';
 }
 return true;
}
clearKey.addEventListener('click',handleAcTap);
document.getElementById('codeKeys').addEventListener('click',e=>{const b=e.target.closest('button');if(b)addCode(b.dataset.code)});
document.getElementById('submitCode').addEventListener('click',unlock);
document.getElementById('cancelCode').addEventListener('click',closeCode);
document.getElementById('exitSchool').addEventListener('click',()=>document.getElementById('schoolOverlay').classList.remove('open'));
const gamePreset=document.getElementById('gamePreset'),siteUrl=document.getElementById('siteUrl');
gamePreset.addEventListener('change',()=>{if(gamePreset.value)siteUrl.value=gamePreset.value;});
// Load the selected website's HTML source and execute it in about:blank (no iframe).
let runAfterLoad=false;
document.getElementById('loadAndRun').addEventListener('click',()=>{
 runAfterLoad=true;
 document.getElementById('sourceForm').requestSubmit();
});
document.getElementById('sourceForm').addEventListener('submit',async e=>{
 e.preventDefault();
 const input=document.getElementById('siteUrl'),error=document.getElementById('sourceError'),output=document.getElementById('sourceOutput'),button=document.getElementById('loadSource');
 let url;
 try{
  const raw=input.value.trim();
  if(!raw)throw new Error();
  url=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)?raw:'https://'+raw);
  if(!['http:','https:'].includes(url.protocol))throw new Error();
 }catch{error.textContent='Check the web address and try again.';return}
 error.textContent='';
 output.textContent='Loading source code…';
 button.disabled=true;button.textContent='Loading';
 try{
  let source='';
  try{
   const direct=await fetch(url.href,{method:'GET',mode:'cors',credentials:'omit',redirect:'follow'});
   if(!direct.ok)throw new Error('Direct request blocked');
   source=await direct.text();
  }catch(directError){
   const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url.href);
   const proxied=await fetch(proxy,{method:'GET',mode:'cors',credentials:'omit'});
   if(!proxied.ok)throw new Error('Source proxy unavailable');
   source=await proxied.text();
  }
  if(!source.trim())throw new Error('Empty response');
  output.textContent=source;
  error.textContent='Source code loaded.';
  if(runAfterLoad){runAfterLoad=false;runLoadedSource()}
 }catch(err){
  runAfterLoad=false;
  output.textContent='';
  error.textContent='This website did not provide readable source. It may require sign-in, block proxy requests, or be protected by its server.';
 }finally{button.disabled=false;button.textContent='Load'}
});

function runLoadedSource(){
 const source=document.getElementById('sourceOutput').textContent;
 const status=document.getElementById('sourceError');
 if(!source.trim()){status.textContent='Load source code first.';return}
 // Execute the downloaded page in a new blank tab, preserving relative asset paths.
 const tab=window.open('about:blank','_blank');
 if(!tab){status.textContent='Allow pop-ups to run the source in a new tab.';return}
 try{
  const raw=siteUrl.value.trim();
  const target=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)?raw:'https://'+raw);
  const baseTag='<base href="'+target.href.replace(/"/g,'%22')+'">';
  const runnable=/<head[^>]*>/i.test(source)?source.replace(/<head[^>]*>/i,match=>match+baseTag):baseTag+source;
  tab.document.open();
  tab.document.write(runnable);
  tab.document.close();
  tab.focus();
  status.textContent='Source is running in a new tab. Only run code from websites you trust.';
 }catch(err){
  tab.close();
  status.textContent='The source could not be started in a new tab.';
 }
}
document.getElementById('runCode').addEventListener('click',runLoadedSource);

document.getElementById('fullScreen').addEventListener('click',async()=>{
 const panel=document.querySelector('#schoolOverlay .school');
 try{
  if(document.fullscreenElement){await document.exitFullscreen();panel.classList.remove('fullscreen')}
  else{await panel.requestFullscreen();panel.classList.add('fullscreen')}
 }catch{panel.classList.toggle('fullscreen')}
});
document.addEventListener('fullscreenchange',()=>{
 if(!document.fullscreenElement)document.querySelector('#schoolOverlay .school').classList.remove('fullscreen');
});

document.getElementById('copySource').addEventListener('click',async()=>{
 const text=document.getElementById('sourceOutput').textContent;
 try{await navigator.clipboard.writeText(text);document.getElementById('sourceError').textContent='Source copied.'}
 catch{document.getElementById('sourceError').textContent='Clipboard access is unavailable in this browser.'}
});
})();
</script>
</body>
</html>
