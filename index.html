  if (e.key === '3') this.setDifficulty(2);\n                        if (e.key === 'Enter' || e.key === ' ') { this.start(); e.preventDefault(); return; }\n                    }\n                    if (this.gameOver && e.key === 'Enter') { this.restart(); return; }\n                    if (e.key === ' ') {\n                        if (this.gameRunning && !this.gamePaused) {\n                            this.bullets.push({ x: this.player.x + this.player.width / 2, y: this.player.y });\n                            audio.fire();\n                        }\n                        e.preventDefault();\n                    }\n                    if (e.key.toLowerCase() === 'p') this.gamePaused = !this.gamePaused;\n                    if (e.key.toLowerCase() === 'm') audio.toggleMute();\n                });\n                document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });\n\n                setInterval(() => {\n                    if (keys['arrowleft']) this.player.x = Math.max(0, this.player.x - 5);\n                    if (keys['arrowright']) this.player.x = Math.min(this.width - this.player.width, this.player.x + 5);\n                }, 16);\n            },\n\n            restart() {\n                this.score = 0;\n                this.wave = 1;\n                this.lives = 3;\n                this.gameRunning = false;\n                this.gamePaused = false;\n                this.gameOver = false;\n                this.bullets = [];\n                this.enemyBullets = [];\n                this.explosions = [];\n                this.particles = [];\n                this.popups = [];\n                this.player = { x: this.width / 2 - 15, y: this.height - 40, width: 30, height: 30, health: 1, renderX: this.width / 2 - 15 };\n                this.applyDifficulty();\n                this.spawnWave();\n                this.screen = 'title';\n                this.screenAlpha = 0;\n                this.draw();\n            },\n\n            gameLoop() {\n                this.update();\n                this.draw();\n                requestAnimationFrame(() => this.gameLoop());\n            }\n        };\n\n        game.init();\n    <\/script>\n</body>\n</html>\n","real-2048":"<!-- Source: https://github.com/prateek121/90s-games/blob/main/games/2048.html\nMIT License. Copyright (c) 2026 Prateek. Original game source retained. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>2048 - 90s Games</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        :root {\n            --c1: #fff8dc;\n            --c2: #f7c873;\n            --c3: #f08a3c;\n            --c4: #c25210;\n            --c5: #5a2a06;\n        }\n        html, body { height: 100%; }\n        body {\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n            color: var(--c5);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            padding: 20px;\n            background: radial-gradient(circle at 20% 20%, #fff3c4 0%, #f7c873 35%, #f08a3c 70%, #c25210 100%);\n            position: relative;\n            overflow: hidden;\n        }\n        body::before {\n            content: \"\";\n            position: fixed;\n            inset: 0;\n            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.04) 0 2px, transparent 2px 28px);\n            pointer-events: none;\n            animation: drift 18s linear infinite;\n        }\n        @keyframes drift {\n            0% { transform: translate(0,0); }\n            100% { transform: translate(56px,56px); }\n        }\n        .container {\n            text-align: center;\n            position: relative;\n            z-index: 1;\n        }\n        h1 {\n            color: var(--c5);\n            font-size: 44px;\n            margin-bottom: 6px;\n            letter-spacing: 4px;\n            text-shadow: 0 2px 0 var(--c2), 0 4px 12px rgba(90,42,6,0.35);\n        }\n        .subtitle { color: var(--c4); font-size: 14px; margin-bottom: 16px; letter-spacing: 1px; }\n        .info-row {\n            display: flex;\n            gap: 14px;\n            justify-content: center;\n            margin-bottom: 16px;\n            flex-wrap: wrap;\n        }\n        .info-box {\n            background: linear-gradient(180deg, var(--c2), var(--c3));\n            border: 2px solid var(--c5);\n            border-radius: 6px;\n            padding: 10px 18px;\n            min-width: 110px;\n            box-shadow: 0 4px 0 var(--c5);\n        }\n        .info-label { color: var(--c5); font-size: 12px; margin-bottom: 4px; letter-spacing: 2px; }\n        .info-value { color: var(--c1); font-size: 28px; font-weight: bold; text-shadow: 0 2px 0 var(--c5); }\n        .stage {\n            position: relative;\n            width: 360px;\n            margin: 0 auto;\n        }\n        canvas#board {\n            display: block;\n            border-radius: 10px;\n            box-shadow: 0 10px 28px rgba(90,42,6,0.4), inset 0 0 0 4px var(--c5);\n            background: #b88a55;\n        }\n        canvas#fx {\n            position: absolute;\n            inset: 0;\n            pointer-events: none;\n        }\n        .controls {\n            margin-top: 18px;\n        }\n        button, select {\n            padding: 10px 18px;\n            background: linear-gradient(180deg, var(--c3), var(--c4));\n            color: var(--c1);\n            border: 2px solid var(--c5);\n            border-radius: 6px;\n            font-weight: bold;\n            cursor: pointer;\n            margin: 4px;\n            font-family: inherit;\n            font-size: 14px;\n            letter-spacing: 1px;\n            box-shadow: 0 3px 0 var(--c5);\n        }\n        button:hover { transform: translateY(-1px); }\n        button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--c5); }\n        .message {\n            margin-top: 16px;\n            font-size: 18px;\n            color: var(--c5);\n            min-height: 22px;\n            font-weight: bold;\n            text-shadow: 0 1px 0 var(--c2);\n        }\n        .diff-row { margin: 6px 0 14px; }\n        .diff-row label { font-size: 13px; letter-spacing: 1px; margin-right: 6px; color: var(--c5); }\n        .hint { color: var(--c5); font-size: 12px; opacity: 0.85; margin-top: 8px; }\n        .overlay {\n            position: absolute;\n            inset: 0;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            flex-direction: column;\n            color: var(--c1);\n            text-shadow: 0 2px 0 var(--c5);\n            background: rgba(90, 42, 6, 0.78);\n            border-radius: 10px;\n            font-size: 22px;\n            opacity: 0;\n            transition: opacity 0.5s;\n            pointer-events: none;\n            text-align: center;\n            padding: 10px;\n        }\n        .overlay.show { opacity: 1; }\n        .overlay .big { font-size: 30px; margin-bottom: 8px; letter-spacing: 2px; }\n        .overlay .small { font-size: 13px; opacity: 0.85; }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>2048</h1>\n        <p class=\"subtitle\">JOIN TILES TO REACH 2048</p>\n\n        <div class=\"info-row\">\n            <div class=\"info-box\">\n                <div class=\"info-label\">SCORE</div>\n                <div class=\"info-value\" id=\"score\">0</div>\n            </div>\n            <div class=\"info-box\">\n                <div class=\"info-label\">BEST</div>\n                <div class=\"info-value\" id=\"best\">0</div>\n            </div>\n        </div>\n\n        <div class=\"diff-row\">\n            <label for=\"diff\">DIFFICULTY</label>\n            <select id=\"diff\" onchange=\"game.setDifficulty(this.value)\">\n                <option value=\"easy\">EASY</option>\n                <option value=\"medium\" selected>MEDIUM</option>\n                <option value=\"hard\">HARD</option>\n            </select>\n        </div>\n\n        <div class=\"stage\">\n            <canvas id=\"board\" width=\"360\" height=\"360\"></canvas>\n            <canvas id=\"fx\" width=\"360\" height=\"360\"></canvas>\n            <div id=\"overlay\" class=\"overlay\"></div>\n        </div>\n\n        <div class=\"controls\">\n            <button onclick=\"game.reset()\">NEW GAME</button>\n            <button onclick=\"game.toggleMute()\" id=\"muteBtn\">SOUND: ON</button>\n            <button onclick=\"location.href='../'\">BACK</button>\n        </div>\n\n        <div class=\"hint\">Arrow keys to slide tiles &middot; M to mute &middot; Merge to score</div>\n        <div class=\"message\" id=\"message\"></div>\n    </div>\n\n    <script>\n        const Sfx = (() => {\n            let ctx = null, muted = false;\n            function ensure() {\n                if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }\n                return ctx;\n            }\n            function beep(freq, dur, type = 'square', vol = 0.08) {\n                if (muted) return;\n                const c = ensure(); if (!c) return;\n                const o = c.createOscillator(), g = c.createGain();\n                o.type = type; o.frequency.value = freq;\n                g.gain.value = vol;\n                o.connect(g); g.connect(c.destination);\n                const t = c.currentTime;\n                g.gain.setValueAtTime(vol, t);\n                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n                o.start(t); o.stop(t + dur);\n            }\n            return {\n                move() { beep(220, 0.06, 'square', 0.05); },\n                merge(value) { beep(330 + Math.log2(value) * 40, 0.18, 'triangle', 0.1); },\n                win() { beep(660, 0.12); setTimeout(() => beep(880, 0.2, 'sine', 0.12), 120); },\n                over() { beep(160, 0.3, 'sawtooth', 0.1); },\n                toggle() { muted = !muted; return muted; },\n                isMuted() { return muted; }\n            };\n        })();\n\n        const DIFF = {\n            easy: { start: 3, label: 'EASY' },\n            medium: { start: 2, label: 'MEDIUM' },\n            hard: { start: 1, label: 'HARD' }\n        };\n        const TILE_PX = 70, GAP = 10, PAD = 10;\n        const board = document.getElementById('board');\n        const fxc = document.getElementById('fx');\n        const bctx = board.getContext('2d');\n        const fctx = fxc.getContext('2d');\n\n        const game = {\n            grid: [],\n            score: 0,\n            best: parseInt(localStorage.getItem('best2048') || '0') || 0,\n            gameOver: false,\n            won: false,\n            difficulty: localStorage.getItem('2048-difficulty') || 'medium',\n            shake: 0,\n            shakeX: 0, shakeY: 0,\n            particles: [],\n            popups: [],\n            anim: [],\n            animT: 0,\n            ANIM_TIME: 9,\n\n            init() {\n                document.getElementById('diff').value = this.difficulty;\n                this.reset();\n                this.loop();\n            },\n\n            setDifficulty(d) {\n                this.difficulty = d;\n                localStorage.setItem('2048-difficulty', d);\n                this.reset();\n            },\n\n            toggleMute() {\n                const m = Sfx.toggle();\n                document.getElementById('muteBtn').textContent = m ? 'SOUND: OFF' : 'SOUND: ON';\n            },\n\n            reset() {\n                this.grid = Array(4).fill().map(() => Array(4).fill(0));\n                this.score = 0;\n                this.gameOver = false;\n                this.won = false;\n                this.particles.length = 0;\n                this.popups.length = 0;\n                this.anim.length = 0;\n                this.animT = 0;\n                const start = DIFF[this.difficulty].start;\n                for (let i = 0; i < start; i++) this.addNewTile();\n                this.hideOverlay();\n                document.getElementById('message').textContent = '';\n                document.getElementById('best').textContent = this.best;\n                document.getElementById('score').textContent = this.score;\n            },\n\n            hideOverlay() {\n                const o = document.getElementById('overlay');\n                o.classList.remove('show');\n                o.innerHTML = '';\n            },\n\n            showOverlay(big, small) {\n                const o = document.getElementById('overlay');\n                o.innerHTML = '<div class=\"big\">' + big + '</div><div class=\"small\">' + small + '</div>';\n                o.classList.add('show');\n            },\n\n            addNewTile() {\n                const empty = [];\n                for (let y = 0; y < 4; y++) {\n                    for (let x = 0; x < 4; x++) {\n                        if (this.grid[y][x] === 0) empty.push({x, y});\n                    }\n                }\n                if (empty.length > 0) {\n                    const pos = empty[Math.floor(Math.random() * empty.length)];\n                    this.grid[pos.y][pos.x] = Math.random() < 0.9 ? 2 : 4;\n                    this.anim.push({ type: 'spawn', x: pos.x, y: pos.y, t: 0 });\n                }\n            },\n\n            move(direction) {\n                if (this.gameOver || this.animT > 0) return;\n\n                let moved = false;\n                const oldGrid = JSON.parse(JSON.stringify(this.grid));\n                const merges = [];\n\n                if (direction === 'left' || direction === 'right') {\n                    for (let y = 0; y < 4; y++) {\n                        if (direction === 'right') this.grid[y].reverse();\n                        const result = this.compressRow(this.grid[y]);\n                        this.grid[y] = result.row;\n                        if (direction === 'right') {\n                            this.grid[y].reverse();\n                            result.merged.forEach(m => merges.push({ x: 3 - m.idx, y, value: m.value }));\n                        } else {\n                            result.merged.forEach(m => merges.push({ x: m.idx, y, value: m.value }));\n                        }\n                    }\n                } else {\n                    for (let x = 0; x < 4; x++) {\n                        let col = [];\n                        for (let y = 0; y < 4; y++) col.push(this.grid[y][x]);\n                        if (direction === 'down') col.reverse();\n                        const result = this.compressRow(col);\n                        let row = result.row;\n                        if (direction === 'down') {\n                            row.reverse();\n                            result.merged.forEach(m => merges.push({ x, y: 3 - m.idx, value: m.value }));\n                        } else {\n                            result.merged.forEach(m => merges.push({ x, y: m.idx, value: m.value }));\n                        }\n                        for (let y = 0; y < 4; y++) this.grid[y][x] = row[y];\n                    }\n                }\n\n                moved = JSON.stringify(oldGrid) !== JSON.stringify(this.grid);\n                if (moved) {\n                    Sfx.move();\n                    this.animT = this.ANIM_TIME;\n                    for (const m of merges) {\n                        this.anim.push({ type: 'merge', x: m.x, y: m.y, value: m.value, t: 0 });\n                        this.spawnParticles(this.cellCenterX(m.x), this.cellCenterY(m.y), m.value);\n                        this.popups.push({ x: this.cellCenterX(m.x), y: this.cellCenterY(m.y), text: '+' + m.value, life: 36, vy: -0.6 });\n                        Sfx.merge(m.value);\n                        this.shake = Math.min(8, 2 + Math.log2(m.value));\n                    }\n                    this.addNewTile();\n                    this.checkGameState();\n                    this.updateScore();\n                }\n            },\n\n            compressRow(row) {\n                row = row.filter(x => x !== 0);\n                const merged = [];\n                for (let i = 0; i < row.length - 1; i++) {\n                    if (row[i] === row[i + 1]) {\n                        row[i] *= 2;\n                        this.score += row[i];\n                        merged.push({ idx: i, value: row[i] });\n                        row.splice(i + 1, 1);\n                    }\n                }\n                while (row.length < 4) row.push(0);\n                return { row, merged };\n            },\n\n            checkGameState() {\n                let won = false;\n                let canMove = false;\n                for (let y = 0; y < 4; y++) {\n                    for (let x = 0; x < 4; x++) {\n                        if (this.grid[y][x] === 2048) won = true;\n                        if (this.grid[y][x] === 0) canMove = true;\n                        if (x < 3 && this.grid[y][x] === this.grid[y][x + 1]) canMove = true;\n                        if (y < 3 && this.grid[y][x] === this.grid[y + 1][x]) canMove = true;\n                    }\n                }\n                if (won && !this.won) {\n                    this.won = true;\n                    document.getElementById('message').textContent = 'YOU REACHED 2048!';\n                    this.showOverlay('YOU WIN!', 'Press NEW GAME to keep going');\n                    Sfx.win();\n                }\n                if (!canMove) {\n                    this.gameOver = true;\n                    document.getElementById('message').textContent = 'GAME OVER';\n                    this.showOverlay('GAME OVER', 'Score: ' + this.score);\n                    Sfx.over();\n                }\n            },\n\n            updateScore() {\n                document.getElementById('score').textContent = this.score;\n                if (this.score > this.best) {\n                    this.best = this.score;\n                    localStorage.setItem('best2048', this.best);\n                    document.getElementById('best').textContent = this.best;\n                }\n            },\n\n            cellCenterX(gx) { return PAD + gx * (TILE_PX + GAP) + TILE_PX / 2; },\n            cellCenterY(gy) { return PAD + gy * (TILE_PX + GAP) + TILE_PX / 2; },\n\n            spawnParticles(x, y, value) {\n                const count = Math.min(20, 8 + Math.floor(Math.log2(value)));\n                const cap = 200;\n                for (let i = 0; i < count && this.particles.length < cap; i++) {\n                    const a = Math.random() * Math.PI * 2;\n                    const s = 1 + Math.random() * 3.5;\n                    this.particles.push({\n                        x, y,\n                        vx: Math.cos(a) * s,\n                        vy: Math.sin(a) * s,\n                        life: 28 + Math.random() * 12,\n                        max: 40,\n                        color: this.tileColor(value),\n                        size: 2 + Math.random() * 2.5\n                    });\n                }\n            },\n\n            tileColor(v) {\n                const palette = {\n                    2: '#fff8dc', 4: '#ffe9a8', 8: '#f7c873',\n                    16: '#f4a649', 32: '#f08a3c', 64: '#e0671e',\n                    128: '#c25210', 256: '#a93f0a', 512: '#8a3208',\n                    1024: '#6b2606', 2048: '#5a2a06'\n                };\n                return palette[v] || '#5a2a06';\n            },\n\n            tileTextColor(v) {\n                return v <= 4 ? '#5a2a06' : '#fff8dc';\n            },\n\n            drawTile(x, y, value, scale) {\n                if (scale === undefined) scale = 1;\n                const cx = this.cellCenterX(x);\n                const cy = this.cellCenterY(y);\n                const half = (TILE_PX / 2) * scale;\n                bctx.save();\n                bctx.translate(cx, cy);\n                bctx.shadowColor = 'rgba(90,42,6,0.45)';\n                bctx.shadowBlur = 10;\n                bctx.shadowOffsetY = 3;\n                const grad = bctx.createLinearGradient(0, -half, 0, half);\n                const col = this.tileColor(value);\n                grad.addColorStop(0, this.lighten(col, 0.2));\n                grad.addColorStop(1, col);\n                bctx.fillStyle = grad;\n                this.roundRect(bctx, -half, -half, half * 2, half * 2, 6);\n                bctx.fill();\n                bctx.restore();\n\n                bctx.save();\n                bctx.translate(cx, cy);\n                bctx.fillStyle = this.tileTextColor(value);\n                bctx.textAlign = 'center';\n                bctx.textBaseline = 'middle';\n                const len = String(value).length;\n                const fontSize = Math.floor((len <= 2 ? 30 : len === 3 ? 24 : 18) * scale);\n                bctx.font = 'bold ' + fontSize + 'px ui-monospace, \"SF Mono\", Menlo, monospace';\n                bctx.strokeStyle = 'rgba(90,42,6,0.35)';\n                bctx.lineWidth = 2;\n                bctx.strokeText(value, 0, 1);\n                bctx.fillText(value, 0, 1);\n                bctx.restore();\n            },\n\n            lighten(hex, amt) {\n                const n = parseInt(hex.slice(1), 16);\n                let r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;\n                r = Math.min(255, Math.floor(r + (255 - r) * amt));\n                g = Math.min(255, Math.floor(g + (255 - g) * amt));\n                b = Math.min(255, Math.floor(b + (255 - b) * amt));\n                return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);\n            },\n\n            roundRect(c, x, y, w, h, r) {\n                c.beginPath();\n                c.moveTo(x + r, y);\n                c.lineTo(x + w - r, y);\n                c.quadraticCurveTo(x + w, y, x + w, y + r);\n                c.lineTo(x + w, y + h - r);\n                c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);\n                c.lineTo(x + r, y + h);\n                c.quadraticCurveTo(x, y + h, x, y + h - r);\n                c.lineTo(x, y + r);\n                c.quadraticCurveTo(x, y, x + r, y);\n                c.closePath();\n            },\n\n            drawBoard() {\n                if (this.shake > 0) {\n                    this.shakeX = (Math.random() - 0.5) * this.shake;\n                    this.shakeY = (Math.random() - 0.5) * this.shake;\n                    this.shake *= 0.85;\n                    if (this.shake < 0.2) this.shake = 0;\n                } else {\n                    this.shakeX = this.shakeY = 0;\n                }\n\n                bctx.save();\n                bctx.translate(this.shakeX, this.shakeY);\n\n                bctx.fillStyle = '#b88a55';\n                bctx.fillRect(0, 0, board.width, board.height);\n\n                for (let y = 0; y < 4; y++) {\n                    for (let x = 0; x < 4; x++) {\n                        const px = PAD + x * (TILE_PX + GAP);\n                        const py = PAD + y * (TILE_PX + GAP);\n                        bctx.fillStyle = 'rgba(255,248,220,0.18)';\n                        this.roundRect(bctx, px, py, TILE_PX, TILE_PX, 5);\n                        bctx.fill();\n                    }\n                }\n\n                for (let y = 0; y < 4; y++) {\n                    for (let x = 0; x < 4; x++) {\n                        const v = this.grid[y][x];\n                        if (v === 0) continue;\n                        let scale = 1;\n                        for (const a of this.anim) {\n                            if (a.x === x && a.y === y) {\n                                if (a.type === 'spawn') {\n                                    scale = Math.min(1, a.t / 8);\n                                } else if (a.type === 'merge') {\n                                    const p = a.t / 10;\n                                    scale = 1 + 0.18 * Math.sin(p * Math.PI);\n                                }\n                            }\n                        }\n                        this.drawTile(x, y, v, scale);\n                    }\n                }\n\n                bctx.restore();\n            },\n\n            drawFx() {\n                fctx.clearRect(0, 0, fxc.width, fxc.height);\n                fctx.save();\n                fctx.translate(this.shakeX, this.shakeY);\n\n                for (let i = this.particles.length - 1; i >= 0; i--) {\n                    const p = this.particles[i];\n                    p.x += p.vx; p.y += p.vy;\n                    p.vx *= 0.94; p.vy *= 0.94;\n                    p.life--;\n                    if (p.life <= 0) { this.particles.splice(i, 1); continue; }\n                    fctx.globalAlpha = Math.max(0, p.life / p.max);\n                    fctx.fillStyle = p.color;\n                    fctx.beginPath();\n                    fctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);\n                    fctx.fill();\n                }\n                fctx.globalAlpha = 1;\n\n                for (let i = this.popups.length - 1; i >= 0; i--) {\n                    const p = this.popups[i];\n                    p.y += p.vy;\n                    p.vy *= 0.96;\n                    p.life--;\n                    if (p.life <= 0) { this.popups.splice(i, 1); continue; }\n                    fctx.globalAlpha = Math.min(1, p.life / 18);\n                    fctx.font = 'bold 20px ui-monospace, \"SF Mono\", Menlo, monospace';\n                    fctx.textAlign = 'center';\n                    fctx.lineWidth = 3;\n                    fctx.strokeStyle = '#5a2a06';\n                    fctx.strokeText(p.text, p.x, p.y);\n                    fctx.fillStyle = '#fff8dc';\n                    fctx.fillText(p.text, p.x, p.y);\n                }\n                fctx.globalAlpha = 1;\n                fctx.restore();\n            },\n\n            loop() {\n                if (this.animT > 0) this.animT--;\n                for (let i = this.anim.length - 1; i >= 0; i--) {\n                    this.anim[i].t++;\n                    if (this.anim[i].t > 16) this.anim.splice(i, 1);\n                }\n                this.drawBoard();\n                this.drawFx();\n                requestAnimationFrame(() => this.loop());\n            }\n        };\n\n        game.init();\n\n        document.addEventListener('keydown', (e) => {\n            switch (e.key) {\n                case 'ArrowLeft': game.move('left'); e.preventDefault(); break;\n                case 'ArrowRight': game.move('right'); e.preventDefault(); break;\n                case 'ArrowUp': game.move('up'); e.preventDefault(); break;\n                case 'ArrowDown': game.move('down'); e.preventDefault(); break;\n                case 'm': case 'M': game.toggleMute(); break;\n            }\n        });\n    <\/script>\n</body>\n</html>\n","breakout":"<!-- Source: https://github.com/prateek121/90s-games/blob/main/games/breakout.html\nMIT License. Copyright (c) 2026 Prateek. Original game source retained. -->\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>BREAKOUT - 90s Games</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n            background: radial-gradient(circle at 20% 10%, #3a1a5e 0%, #1c0d3a 45%, #08051a 100%);\n            display: flex;\n            justify-content: center;\n            align-items: center;\n            min-height: 100vh;\n            padding: 20px;\n            color: #f5e8ff;\n        }\n        .container {\n            display: flex;\n            gap: 30px;\n            flex-wrap: wrap;\n            justify-content: center;\n            align-items: flex-start;\n        }\n        canvas#gameCanvas {\n            border: 3px solid #ffb8de;\n            background: #08051a;\n            display: block;\n            box-shadow: 0 0 35px rgba(255, 184, 222, 0.4);\n            border-radius: 6px;\n        }\n        .info { color: #f5e8ff; min-width: 260px; }\n        .stat-box {\n            background: rgba(255, 184, 222, 0.08);\n            border: 2px solid #ffb8de;\n            padding: 14px;\n            margin-bottom: 12px;\n            border-radius: 6px;\n        }\n        .stat-label { font-size: 12px; text-transform: uppercase; margin-bottom: 4px; font-weight: bold; color: #ffd166; }\n        .stat-value { font-size: 26px; font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace; font-weight: bold; color: #fff; }\n        button, .mode-btn {\n            width: 100%;\n            padding: 9px;\n            background: #ffb8de;\n            color: #1a0a30;\n            border: none;\n            font-weight: bold;\n            cursor: pointer;\n            margin: 4px 0;\n            border-radius: 4px;\n            transition: transform 0.15s, background 0.15s;\n            font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n        }\n        button:hover, .mode-btn:hover { transform: scale(1.03); background: #ffd166; }\n        .mode-btn.active { background: #9be36b; color: #08051a; }\n        .controls, .difficulty-box {\n            background: rgba(255, 184, 222, 0.08);\n            border: 2px solid #ffb8de;\n            padding: 12px;\n            font-size: 13px;\n            border-radius: 6px;\n            line-height: 1.7;\n            margin-bottom: 12px;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <canvas id=\"gameCanvas\" width=\"600\" height=\"400\"></canvas>\n        <div class=\"info\">\n            <div class=\"stat-box\"><div class=\"stat-label\">Score</div><div class=\"stat-value\" id=\"score\">0</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Level</div><div class=\"stat-value\" id=\"level\">1</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Lives</div><div class=\"stat-value\" id=\"lives\">3</div></div>\n            <div class=\"stat-box\"><div class=\"stat-label\">Bricks</div><div class=\"stat-value\" id=\"bricks\">30</div></div>\n            <div class=\"controls\">\n                <strong style=\"color:#ffd166\">CONTROLS</strong>\n                <p>&larr; &rarr; Move paddle</p>\n                <p>SPACE Launch ball</p>\n                <p>P Pause &nbsp; M Mute</p>\n            </div>\n            <div class=\"difficulty-box\">\n                <strong style=\"color:#ffd166\">DIFFICULTY</strong><br/>\n                <button class=\"mode-btn\" data-diff=\"easy\" onclick=\"game.setDifficulty('easy', this)\">Easy</button>\n                <button class=\"mode-btn active\" data-diff=\"medium\" onclick=\"game.setDifficulty('medium', this)\">Medium</button>\n                <button class=\"mode-btn\" data-diff=\"hard\" onclick=\"game.setDifficulty('hard', this)\">Hard</button>\n            </div>\n            <div class=\"stat-box\" style=\"font-size:12px\">\n                <strong style=\"color:#ffd166\">ACTIVE POWERUP</strong>\n                <div id=\"activePowerup\">None</div>\n            </div>\n            <button onclick=\"game.start()\">START GAME</button>\n            <button onclick=\"game.restart()\">NEW GAME</button>\n            <button onclick=\"location.href='../'\">BACK</button>\n        </div>\n    </div>\n    <script>\n        const audio = {\n            ctx: null, muted: false,\n            init() {\n                try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}\n                this.muted = localStorage.getItem('breakout-muted') === '1';\n            },\n            resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },\n            toggleMute() {\n                this.muted = !this.muted;\n                localStorage.setItem('breakout-muted', this.muted ? '1' : '0');\n            },\n            tone(freq, dur, type, gain) {\n                if (!this.ctx || this.muted) return;\n                this.resume();\n                const o = this.ctx.createOscillator();\n                const g = this.ctx.createGain();\n                o.type = type || 'square';\n                o.frequency.setValueAtTime(freq, this.ctx.currentTime);\n                g.gain.setValueAtTime(0, this.ctx.currentTime);\n                g.gain.linearRampToValueAtTime(gain || 0.18, this.ctx.currentTime + 0.005);\n                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);\n                o.connect(g).connect(this.ctx.destination);\n                o.start();\n                o.stop(this.ctx.currentTime + dur);\n            },\n            paddle() { this.tone(380, 0.06, 'square', 0.2); },\n            brick()  { this.tone(560, 0.05, 'triangle', 0.18); },\n            powerup(){ this.tone(720, 0.1, 'sine', 0.2); setTimeout(()=>this.tone(960,0.1,'sine',0.18),80); },\n            lose()   { this.tone(220, 0.25, 'sawtooth', 0.22); },\n            launch() { this.tone(500, 0.08, 'square', 0.18); }\n        };\n        const game = {\n            canvas: document.getElementById('gameCanvas'),\n            ctx: null,\n            width: 600,\n            height: 400,\n            paddleWidth: 70,\n            paddleHeight: 12,\n            ballRadius: 4,\n            brickWidth: 60,\n            brickHeight: 14,\n            paddle: null, ball: null,\n            bricks: [], powerups: [], particles: [], popups: [],\n            shake: { mag: 0, dx: 0, dy: 0 },\n            score: 0, level: 1, lives: 3,\n            gameRunning: false, gamePaused: false, gameOver: false,\n            ballLaunched: false,\n            activePowerup: null, powerupTimer: 0,\n            titleAlpha: 1, gameOverAlpha: 0, time: 0, stars: [],\n            difficulty: 'medium', paddleTargetX: 0,\n            diffMap: {\n                easy:   { speed: 0.85 },\n                medium: { speed: 1.0 },\n                hard:   { speed: 1.25 }\n            },\n            init() {\n                this.ctx = this.canvas.getContext('2d');\n                audio.init();\n                this.difficulty = localStorage.getItem('breakout-difficulty') || 'medium';\n                document.querySelectorAll('[data-diff]').forEach(b => {\n                    b.classList.toggle('active', b.dataset.diff === this.difficulty);\n                });\n                this.paddle = { x: this.width / 2 - this.paddleWidth / 2, y: this.height - 30 };\n                this.paddleTargetX = this.paddle.x;\n                this.ball = { x: this.paddle.x + this.paddleWidth / 2, y: this.paddle.y - 10, vx: 0, vy: 0, trail: [] };\n                for (let i = 0; i < 50; i++) {\n                    this.stars.push({ x: Math.random()*this.width, y: Math.random()*this.height*0.7, s: Math.random()*1.5+0.2, t: Math.random()*6.28 });\n                }\n                this.setupInput();\n                this.createBricks();\n                this.gameLoop();\n            },\n            setDifficulty(d, btn) {\n                this.difficulty = d;\n                localStorage.setItem('breakout-difficulty', d);\n                document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));\n                if (btn) btn.classList.add('active');\n            },\n            createBricks() {\n                this.bricks = [];\n                const cols = Math.floor(this.width / this.brickWidth);\n                const rows = 5 + Math.floor(this.level / 2);\n                const palette = ['#ff5cc8', '#ffb8de', '#ffd166', '#9be36b', '#4cd9ff'];\n                for (let row = 0; row < rows; row++) {\n                    for (let col = 0; col < cols; col++) {\n                        const h = Math.min(3, 1 + Math.floor(this.level / 3));\n                        this.bricks.push({\n                            x: col * this.brickWidth + 1,\n                            y: 50 + row * (this.brickHeight + 2),\n                            width: this.brickWidth - 2,\n                            height: this.brickHeight,\n                            health: h, maxHealth: h,\n                            color: palette[row % palette.length]\n                        });\n                    }\n                }\n            },\n            start() {\n                if (this.gameOver) return;\n                if (!this.ballLaunched) {\n                    this.ballLaunched = true; this.gameRunning = true; this.titleAlpha = 0;\n                    const sp = this.diffMap[this.difficulty].speed;\n                    this.ball.vx = (Math.random() - 0.5) * 4 * sp;\n                    this.ball.vy = -5 * sp;\n                    audio.launch();\n                }\n            },\n            emitParticles(x, y, color, count) {\n                count = count || 14; const limit = 200;\n                for (let i = 0; i < count; i++) {\n                    if (this.particles.length >= limit) break;\n                    const a = Math.random() * Math.PI * 2;\n                    const s = Math.random() * 3.5 + 0.7;\n                    this.particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30, max: 30, color });\n                }\n            },\n            addPopup(x, y, text, color) {\n                this.popups.push({ x, y, text, color: color || '#ffd166', life: 50, max: 50 });\n            },\n            triggerShake(mag) { this.shake.mag = Math.max(this.shake.mag, mag); },\n            update() {\n                this.time++;\n                this.paddle.x += (this.paddleTargetX - this.paddle.x) * 0.35;\n                for (let i = this.particles.length-1; i >= 0; i--) {\n                    const p = this.particles[i];\n                    p.x += p.vx; p.y += p.vy;\n                    p.vx *= 0.96; p.vy *= 0.96; p.vy += 0.05;\n                    p.life--;\n                    if (p.life <= 0) this.particles.splice(i,1);\n                }\n                for (let i = this.popups.length-1; i >= 0; i--) {\n                    const p = this.popups[i];\n                    p.y -= 0.8; p.life--;\n                    if (p.life <= 0) this.popups.splice(i,1);\n                }\n                if (this.shake.mag > 0.1) {\n                    this.shake.dx = (Math.random()-0.5) * this.shake.mag;\n                    this.shake.dy = (Math.random()-0.5) * this.shake.mag;\n                    this.shake.mag *= 0.85;\n                } else { this.shake.dx = 0; this.shake.dy = 0; }\n                if (this.gameOver) {\n                    this.gameOverAlpha = Math.min(1, this.gameOverAlpha + 0.04);\n                }\n                if (!this.gameRunning || this.gamePaused) return;\n                if (this.ballLaunched) {\n                    this.ball.trail.push({x:this.ball.x, y:this.ball.y});\n                    if (this.ball.trail.length > 10) this.ball.trail.shift();\n                    this.ball.x += this.ball.vx;\n                    this.ball.y += this.ball.vy;\n                    if (this.ball.x - this.ballRadius < 0 || this.ball.x + this.ballRadius > this.width) {\n                        this.ball.vx = -this.ball.vx;\n                        this.ball.x = Math.max(this.ballRadius, Math.min(this.width - this.ballRadius, this.ball.x));\n                    }\n                    if (this.ball.y - this.ballRadius < 0) { this.ball.vy = -this.ball.vy; }\n                    if (this.ball.y + this.ballRadius > this.paddle.y &&\n                        this.ball.y - this.ballRadius < this.paddle.y + this.paddleHeight &&\n                        this.ball.x > this.paddle.x && this.ball.x < this.paddle.x + this.paddleWidth) {\n                        this.ball.vy = -Math.abs(this.ball.vy);\n                        this.ball.y = this.paddle.y - this.ballRadius;\n                        const collidePoint = this.ball.x - (this.paddle.x + this.paddleWidth / 2);\n                        this.ball.vx += collidePoint * 0.1;\n                        audio.paddle();\n                        this.emitParticles(this.ball.x, this.paddle.y, '#ffd166', 8);\n                    }\n                    for (let i = this.bricks.length - 1; i >= 0; i--) {\n                        const brick = this.bricks[i];\n                        if (this.ball.x > brick.x && this.ball.x < brick.x + brick.width &&\n                            this.ball.y > brick.y && this.ball.y < brick.y + brick.height) {\n                            brick.health--;\n                            if (brick.health <= 0) {\n                                this.bricks.splice(i, 1);\n                                const points = 100 * this.level;\n                                this.score += points;\n                                this.addPopup(brick.x + brick.width/2, brick.y, '+' + points, brick.color);\n                                this.emitParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.color, 16);\n                                this.triggerShake(3);\n                                if (Math.random() < 0.1) this.spawnPowerup(brick.x, brick.y);\n                            } else {\n                                this.emitParticles(this.ball.x, this.ball.y, brick.color, 5);\n                            }\n                            audio.brick();\n                            this.ball.vy = -this.ball.vy;\n                            break;\n                        }\n                    }\n                    if (this.ball.y > this.height) {\n                        this.lives--;\n                        audio.lose();\n                        this.triggerShake(10);\n                        if (this.lives <= 0) {\n                            this.gameOver = true; this.gameRunning = false;\n                        } else {\n                            this.resetBall();\n                        }\n                    }\n                    if (this.bricks.length === 0) {\n                        this.level++;\n                        this.createBricks();\n                        this.resetBall();\n                        this.addPopup(this.width/2, this.height/2, 'LEVEL ' + this.level, '#9be36b');\n                    }\n                }\n                for (let i = this.powerups.length - 1; i >= 0; i--) {\n                    const pu = this.powerups[i];\n                    pu.y += 2;\n                    if (pu.y > this.paddle.y - 10 && pu.y < this.paddle.y + 20 &&\n                        pu.x > this.paddle.x && pu.x < this.paddle.x + this.paddleWidth) {\n                        this.activatePowerup(pu.type);\n                        this.powerups.splice(i, 1);\n                        audio.powerup();\n                    } else if (pu.y > this.height) {\n                        this.powerups.splice(i, 1);\n                    }\n                }\n                if (this.powerupTimer > 0) {\n                    this.powerupTimer--;\n                    if (this.powerupTimer === 0) {\n                        this.activePowerup = null;\n                        this.paddleWidth = 70;\n                    }\n                }\n            },\n            resetBall() {\n                this.ball.x = this.paddle.x + this.paddleWidth / 2;\n                this.ball.y = this.paddle.y - 10;\n                this.ball.vx = 0; this.ball.vy = 0;\n                this.ball.trail = [];\n                this.ballLaunched = false;\n            },\n            spawnPowerup(x, y) {\n                const types = ['expand', 'slow', 'fast', 'multi'];\n                this.powerups.push({\n                    x: x + this.brickWidth/2, y,\n                    type: types[Math.floor(Math.random() * types.length)],\n                    size: 12\n                });\n            },\n            activatePowerup(type) {\n                this.activePowerup = type;\n                this.powerupTimer = 300;\n                switch(type) {\n                    case 'expand': this.paddleWidth = 100; break;\n                    case 'slow': this.ball.vx *= 0.7; this.ball.vy *= 0.7; break;\n                    case 'fast': this.ball.vx *= 1.3; this.ball.vy *= 1.3; break;\n                    case 'multi': this.score += 500; this.addPopup(this.paddle.x + this.paddleWidth/2, this.paddle.y - 20, '+500 BONUS', '#ffd166'); break;\n                }\n            },\n            draw() {\n                const ctx = this.ctx;\n                ctx.save();\n                ctx.translate(this.shake.dx, this.shake.dy);\n                const bg = ctx.createLinearGradient(0, 0, 0, this.height);\n                bg.addColorStop(0, '#1a0a30'); bg.addColorStop(1, '#08051a');\n                ctx.fillStyle = bg;\n                ctx.fillRect(0, 0, this.width, this.height);\n                for (const s of this.stars) {\n                    const a = 0.4 + 0.6 * Math.sin(s.t + this.time * 0.04);\n                    ctx.fillStyle = `rgba(255, 220, 240, ${a})`;\n                    ctx.fillRect(s.x, s.y, s.s, s.s);\n                }\n                for (let i = 0; i < this.ball.trail.length; i++) {\n                    const t = this.ball.trail[i];\n                    const a = i / this.ball.trail.length;\n                    ctx.fillStyle = `rgba(255, 209, 102, ${a*0.35})`;\n                    ctx.beginPath();\n                    ctx.arc(t.x, t.y, this.ballRadius * a, 0, Math.PI*2);\n                    ctx.fill();\n                }\n                const pgrd = ctx.createLinearGradient(this.paddle.x, this.paddle.y, this.paddle.x, this.paddle.y + this.paddleHeight);\n                pgrd.addColorStop(0, '#9be36b'); pgrd.addColorStop(1, '#3a8a2c');\n                ctx.shadowColor = '#9be36b'; ctx.shadowBlur = 14;\n                ctx.fillStyle = pgrd;\n                ctx.fillRect(this.paddle.x, this.paddle.y, this.paddleWidth, this.paddleHeight);\n                ctx.shadowBlur = 0;\n                ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 18;\n                ctx.fillStyle = '#fff';\n                ctx.beginPath();\n                ctx.arc(this.ball.x, this.ball.y, this.ballRadius + 1, 0, Math.PI*2);\n                ctx.fill();\n                ctx.shadowBlur = 0;\n                for (let brick of this.bricks) {\n                    const ratio = brick.health / brick.maxHealth;\n                    const grd = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.height);\n                    grd.addColorStop(0, brick.color);\n                    grd.addColorStop(1, this.darken(brick.color, 0.55));\n                    ctx.globalAlpha = 0.35 + ratio * 0.65;\n                    ctx.fillStyle = grd;\n                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);\n                    ctx.strokeStyle = 'rgba(255,255,255,0.18)';\n                    ctx.strokeRect(brick.x+0.5, brick.y+0.5, brick.width-1, brick.height-1);\n                    ctx.globalAlpha = 1;\n                }\n                for (let pu of this.powerups) {\n                    ctx.shadowColor = '#ff5cc8'; ctx.shadowBlur = 12;\n                    ctx.fillStyle = '#ff5cc8';\n                    ctx.fillRect(pu.x - pu.size / 2, pu.y, pu.size, pu.size);\n                    ctx.fillStyle = '#fff';\n                    ctx.font = 'bold 10px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    ctx.textAlign = 'center';\n                    ctx.fillText(pu.type[0].toUpperCase(), pu.x, pu.y + 9);\n                    ctx.shadowBlur = 0;\n                    ctx.textAlign = 'left';\n                }\n                for (const p of this.particles) {\n                    const a = p.life / p.max;\n                    ctx.globalAlpha = a;\n                    ctx.fillStyle = p.color;\n                    ctx.fillRect(p.x-1.5, p.y-1.5, 3, 3);\n                }\n                ctx.globalAlpha = 1;\n                ctx.font = 'bold 24px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.outline('SCORE ' + this.score, 10, 28, '#fff', '#000');\n                ctx.font = '18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                this.outline('LIVES ' + this.lives, this.width - 110, 24, '#ffd166', '#000');\n                this.outline('LVL ' + this.level, this.width/2 - 30, 24, '#9be36b', '#000');\n                for (const p of this.popups) {\n                    ctx.globalAlpha = p.life / p.max;\n                    ctx.font = 'bold 18px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    ctx.textAlign = 'center';\n                    this.outline(p.text, p.x, p.y, p.color, '#000');\n                    ctx.globalAlpha = 1;\n                    ctx.textAlign = 'left';\n                }\n                if (this.titleAlpha > 0.01) {\n                    ctx.globalAlpha = this.titleAlpha;\n                    ctx.fillStyle = 'rgba(0,0,0,0.55)';\n                    ctx.fillRect(0, 0, this.width, this.height);\n                    ctx.font = 'bold 54px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    ctx.textAlign = 'center';\n                    this.outline('BREAKOUT', this.width/2, this.height/2 - 30, '#ffb8de', '#000');\n                    ctx.font = '20px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    this.outline('PRESS SPACE TO LAUNCH', this.width/2, this.height/2 + 8, '#ffd166', '#000');\n                    ctx.font = '14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    this.outline('Arrows move - P pause - M mute', this.width/2, this.height/2 + 36, '#f5e8ff', '#000');\n                    ctx.globalAlpha = 1;\n                    ctx.textAlign = 'left';\n                    if (this.ballLaunched) this.titleAlpha = Math.max(0, this.titleAlpha - 0.05);\n                }\n                if (this.gamePaused) {\n                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';\n                    ctx.fillRect(0, 0, this.width, this.height);\n                    ctx.fillStyle = '#ffb8de';\n                    ctx.font = 'bold 32px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    ctx.textAlign = 'center';\n                    ctx.fillText('PAUSED', this.width / 2, this.height / 2);\n                    ctx.textAlign = 'left';\n                }\n                if (this.gameOver) {\n                    ctx.globalAlpha = this.gameOverAlpha;\n                    ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';\n                    ctx.fillRect(0, 0, this.width, this.height);\n                    ctx.font = 'bold 44px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    ctx.textAlign = 'center';\n                    this.outline('GAME OVER', this.width / 2, this.height / 2 - 20, '#ff5cc8', '#000');\n                    ctx.font = '20px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace';\n                    this.outline(`Final Score: ${this.score}`, this.width / 2, this.height / 2 + 20, '#fff', '#000');\n                    ctx.globalAlpha = 1;\n                    ctx.textAlign = 'left';\n                }\n                ctx.restore();\n                document.getElementById('score').textContent = this.score;\n                document.getElementById('level').textContent = this.level;\n                document.getElementById('lives').textContent = this.lives;\n                document.getElementById('bricks').textContent = this.bricks.length;\n                document.getElementById('activePowerup').textContent = this.activePowerup || 'None';\n            },\n            darken(hex, f) {\n                const m = hex.match(/^#([0-9a-f]{6})$/i);\n                if (!m) return hex;\n                const n = parseInt(m[1], 16);\n                const r = Math.floor(((n>>16)&255) * f);\n                const g = Math.floor(((n>>8)&255) * f);\n                const b = Math.floor((n&255) * f);\n                return `rgb(${r},${g},${b})`;\n            },\n            outline(text, x, y, fill, stroke) {\n                const ctx = this.ctx;\n                ctx.lineWidth = 4;\n                ctx.strokeStyle = stroke;\n                ctx.strokeText(text, x, y);\n                ctx.fillStyle = fill;\n                ctx.fillText(text, x, y);\n            },\n            setupInput() {\n                const keys = {};\n                document.addEventListener('keydown', (e) => {\n                    keys[e.key.toLowerCase()] = true;\n                    audio.resume();\n                    if (e.key === ' ') { this.start(); e.preventDefault(); }\n                    if (e.key.toLowerCase() === 'p') { this.gamePaused = !this.gamePaused; }\n                    if (e.key.toLowerCase() === 'm') audio.toggleMute();\n                });\n                document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });\n                setInterval(() => {\n                    const spd = 8 * this.diffMap[this.difficulty].speed;\n                    if (keys['arrowleft']) this.paddleTargetX = Math.max(0, this.paddleTargetX - spd);\n                    if (keys['arrowright']) this.paddleTargetX = Math.min(this.width - this.paddleWidth, this.paddleTargetX + spd);\n                }, 16);\n            },\n            restart() {\n                this.score = 0; this.level = 1; this.lives = 3;\n                this.gameRunning = false; this.gamePaused = false; this.gameOver = false;\n                this.ballLaunched = false;\n                this.activePowerup = null;\n                this.paddleWidth = 70;\n                this.paddle = { x: this.width / 2 - this.paddleWidth / 2, y: this.height - 30 };\n                this.paddleTargetX = this.paddle.x;\n                this.titleAlpha = 1; this.gameOverAlpha = 0;\n                this.particles = []; this.popups = [];\n                this.resetBall();\n                this.createBricks();\n                this.powerups = [];\n            },\n            gameLoop() {\n                this.update();\n                this.draw();\n                requestAnimationFrame(() => this.gameLoop());\n            }\n        };\n        game.init();\n    <\/script>\n</body>\n</html>\n"};
const importedGameTitles={
 "real-cookie":"Cookie Clicker (community clone)",
 asteroids:"Asteroids",tetris:"Tetris",snake:"Snake",pacman:"Pac-Man",
 "space-invaders":"Space Invaders","real-2048":"2048",breakout:"Breakout"

async function readWithProgress(response){
 const progress=$('loadProgress'),track=$('loadProgressTrack'),bar=$('loadProgressBar');
 const total=Number(response.headers.get('content-length'))||0,start=Date.now();
 if(!response.body?.getReader){progress.textContent='Downloading… remaining time unavailable';return response.text();}
 const reader=response.body.getReader(),chunks=[];let received=0;
 while(true){
  const part=await reader.read();if(part.done)break;
  chunks.push(part.value);received+=part.value.length;
  if(total>0){
   const elapsed=Math.max((Date.now()-start)/1000,.1),remaining=(total-received)/(received/elapsed);
   const pct=Math.min(100,received/total*100);
   progress.textContent='Downloading '+Math.round(pct)+'% · '+(remaining<1?'less than 1 second':Math.ceil(remaining)+' seconds remaining');
   track.style.display='block';bar.style.width=pct+'%';
  }else{progress.textContent='Downloading… remaining time unavailable (server hides file size)';track.style.display='block';}
 }
 return new Blob(chunks).text();
}
async function loadSource(){
 const error=$('sourceError'),output=$('sourceOutput'),button=$('loadSource'),progress=$('loadProgress'),track=$('loadProgressTrack'),bar=$('loadProgressBar');
 let url;
 try{
  const raw=siteInput.value.trim();if(!raw)throw new Error('Enter a website address first.');
  url=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)?raw:'https://'+raw);
  if(!['http:','https:'].includes(url.protocol))throw new Error('Only HTTP and HTTPS addresses are supported.');
 }catch(err){error.textContent=err.message;return;}
 error.textContent='';output.textContent='';progress.textContent='Connecting…';track.style.display='none';bar.style.width='0';
 button.disabled=true;button.textContent='Loading…';
 try{
  let response=null;const errors=[];
  const attempts=[
   ['Direct',url.href,'direct'],
   ['cors.dev','https://proxy.cors.dev/'+url.href,'proxy'],
   ['AllOrigins','https://api.allorigins.win/raw?url='+encodeURIComponent(url.href),'proxy'],
   ['ThingProxy','https://thingproxy.freeboard.io/fetch/'+url.href,'proxy']
  ];
  for(const [label,endpoint,kind] of attempts){
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(new Error('Request timed out after 18 seconds')),18000);
   try{
    progress.textContent='Trying '+label+'…';
    const candidate=await fetch(endpoint,{mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal,cache:'no-store'});
    if(!candidate.ok)throw new Error('HTTP '+candidate.status);
    const length=Number(candidate.headers.get('content-length'))||0;
    if(length>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
    response=candidate;lastBaseUrl=kind==='direct'?(candidate.url||url.href):url.href;
    window.clearTimeout(timeout);
    break;
   }catch(err){window.clearTimeout(timeout);controller.abort();errors.push(label+': '+(err.message||'request failed'));}
  }
  if(!response)throw new Error(errors.join(' | '));
  const source=await readWithProgress(response);
  if(new Blob([source]).size>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
  if(!source.trim())throw new Error('The server returned an empty page.');
  output.textContent=source;
  if(!lastBaseUrl)lastBaseUrl=url.href;
  progress.textContent='Source loaded successfully.';
 }catch(err){
  error.textContent='Could not load source: '+err.message;
  progress.textContent='';
 }finally{button.disabled=false;button.textContent='Load Source';}
}
async function runLoadedSource(){
 const source=$('sourceOutput').textContent,status=$('sourceError');
 if(!source.trim()){status.textContent='Load source first.';return;}
 const tab=window.open('about:blank','_blank');
 if(!tab){status.textContent='Pop-up blocked. Allow pop-ups and try again.';return;}
 try{
  const baseUrl=lastBaseUrl||siteInput.value.trim();
  const base=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(baseUrl)?baseUrl:'https://'+baseUrl);
  const parsed=new DOMParser().parseFromString(source,'text/html');
  const target=tab.document;
  const root=target.documentElement;
  for(const attr of [...parsed.documentElement.attributes])root.setAttribute(attr.name,attr.value);
  root.innerHTML=parsed.documentElement.innerHTML;
  target.title=parsed.title||base.hostname;
  const baseTag=target.createElement('base');
  baseTag.href=base.href;
  target.head.insertBefore(baseTag,target.head.firstChild);
  target.documentElement.style.cssText='min-height:100%;';
  target.body.style.minHeight='100vh';
  const inertScripts=[...target.querySelectorAll('script')];
  for(const inert of inertScripts){
   if(!inert.isConnected)continue;
   const live=target.createElement('script');
   for(const attr of [...inert.attributes])live.setAttribute(attr.name,attr.value);
   if(!inert.hasAttribute('async'))live.async=false;
   live.textContent=inert.textContent;
   const waitForLoad=live.src&&!live.async?new Promise(resolve=>{
    live.addEventListener('load',resolve,{once:true});
    live.addEventListener('error',resolve,{once:true});
   }):null;
   inert.replaceWith(live);
   if(waitForLoad)await Promise.race([waitForLoad,new Promise(resolve=>setTimeout(resolve,12000))]);
  }
  tab.focus();
  status.textContent='Running the HTML directly in the new about:blank tab (no iframe). External scripts and assets load from the original website when the server allows them.';
 }catch(err){status.textContent='Could not start source: '+(err.message||String(err));}
}
$('runCode').addEventListener('click',runLoadedSource);
