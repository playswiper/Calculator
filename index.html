<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">

<title>Calculator</title>
<style>
:root{color-scheme:dark;--orange:#ff9f0a;--panel:#171717;--muted:#a5a5a5}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:"Fredoka",sans-serif}
body{min-height:100dvh;display:grid;place-items:center;padding:16px}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.calculator{width:min(100%,390px);display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(9px,2vh,16px)}
.display{height:clamp(120px,27vh,220px);display:flex;align-items:flex-end;justify-content:flex-end;padding:0 8px 12px;overflow:hidden}
#screen{width:100%;text-align:right;white-space:nowrap;overflow:hidden;font-size:clamp(48px,14vw,76px);font-weight:300;letter-spacing:-3px;line-height:1.1}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.3vw,13px)}
.key{appearance:none;border:0;border-radius:50%;aspect-ratio:1;background:#292929;color:#fff;font-size:clamp(22px,6vw,30px);font-weight:400;display:grid;place-items:center;min-width:0;transition:filter .12s,transform .08s;-webkit-tap-highlight-color:transparent}
.key:active{filter:brightness(1.25)}
.utility{background:#a5a5a5;color:#000}
.operator{background:var(--orange);color:#fff;font-size:clamp(27px,7vw,36px)}
.operator.selected{background:#fff;color:var(--orange)}
.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;justify-content:start;padding-left:calc(25% - 8px)}
.overlay{position:fixed;inset:0;z-index:5;background:#000e;display:none;place-items:center;padding:18px}
.overlay.open{display:grid}
.dialog{width:min(100%,520px);max-height:min(88dvh,850px);overflow:auto;background:#111;border:1px solid #303030;border-radius:22px;padding:22px;box-shadow:0 24px 80px #000}
.dialog h1{font-size:21px;margin:0 0 8px}
.dialog p{color:#aaa;font-size:14px;line-height:1.5;margin:0 0 16px}
.code-display{height:54px;border-radius:12px;background:#050505;border:1px solid #333;display:grid;place-items:center;font-size:25px;letter-spacing:9px;margin:14px 0}
.code-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.code-grid button,.secondary{border:1px solid #333;background:#222;color:#fff;border-radius:12px;padding:14px;font-size:18px}
.code-grid button:active,.secondary:active{background:#444}
.dialog-actions{display:flex;gap:10px;margin-top:14px}
.dialog-actions button{flex:1}
.secondary{font-size:14px;padding:12px}
.error{color:#ff7777!important;min-height:18px}#loadProgress{font-size:12px;color:#aaa;min-height:18px;margin-top:6px}#loadProgressTrack{height:4px;background:#292929;border-radius:99px;overflow:hidden;margin-top:7px;display:none}#loadProgressBar{height:100%;width:0;background:var(--orange);transition:width .15s linear}
.school{width:min(100%,900px)}
.school.fullscreen{position:fixed;inset:0;width:100%;height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column}
.school.fullscreen .source{max-height:24dvh}
.url-row{display:flex;gap:8px}
.url-row input,.url-row select{min-width:0;background:#050505;color:white;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.url-row input{flex:1}.preset-row{display:flex;gap:8px;margin-top:10px}.preset-row select{flex:1;min-width:0;background:#050505;color:#fff;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}.preset-row button{white-space:nowrap}.school.fullscreen .preset-row{flex-shrink:0}
#gameSearch{width:100%}#builtInGamePreset{flex:1;min-width:0;background:#050505;color:#fff;border:1px solid #393939;border-radius:11px;padding:12px;font-family:"Fredoka",sans-serif}
#loadBuiltInGame{white-space:nowrap}
body.light-mode #builtInGamePreset{background:#fff;color:#111;border-color:#ccc}
.primary{background:var(--orange);color:#111;border:0;border-radius:11px;padding:12px 16px;font-weight:700}
.source{white-space:pre;overflow:auto;user-select:text;-webkit-user-select:text;max-height:48dvh;background:#050505;border:1px solid #333;border-radius:12px;padding:14px;font:12px/1.5 "Fredoka",sans-serif;color:#ddd;margin-top:14px;tab-size:2}
#acCounter{position:absolute;top:10px;left:12px;color:#ff9f0a;font-size:12px;letter-spacing:.5px;display:none}
body.light-mode,body.light-mode .overlay{background:#f4f4f4;color:#111}
body.light-mode .key{background:#dedede;color:#111}
body.light-mode .utility{background:#bcbcbc;color:#111}
body.light-mode .operator{background:#ff9f0a;color:#fff}
body.light-mode .dialog{background:#fff;color:#111;border-color:#ccc}
body.light-mode .dialog p{color:#555}
body.light-mode .source{background:#f4f4f4;color:#222;border-color:#ccc}
body.light-mode .url-row input,body.light-mode .url-row select,body.light-mode .preset-row select{background:#fff;color:#111;border-color:#ccc}
@media(min-width:500px){.calculator{width:360px}.keys{gap:12px}.key{font-size:28px}}
</style>
</head>

  <div class="url-row" id="sourceForm">
   <input id="siteUrl" type="text" placeholder="https://example.com" autocomplete="url" inputmode="url">

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const screen=$('screen'),keys=$('keys');
let value='0',stored=null,operator=null,waiting=false,finished=false;
let warmup=0,warmupAt=0,armed=false,acCount=0,schoolUnlocked=false;
let lightEquals=0,lightStage='equals',lightDigits='',patternIndex=0,patternAt=0;
let lastBaseUrl='';
const format=n=>Number.isFinite(n)?String(Number(n.toPrecision(11))):'Error';
function render(){
 let shown=value;
 if(shown.length>11&&shown!=='Error')shown=Number(shown).toExponential(5);
 screen.textContent=shown;
 keys.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('selected',waiting&&b.dataset.op===operator));
}
function inputDigit(d){
 if(secretDigit(d))return;
 if(value==='Error'||waiting||finished){value=d;waiting=false;finished=false;}
 else if(value.replace('-','').length<14)value=value==='0'?d:value+d;
 render();
}
function inputDecimal(){
 if(value==='Error'||waiting||finished){value='0.';waiting=false;finished=false;}
 else if(!value.includes('.'))value+='.';
 render();
}
function calculate(a,b,op){
 switch(op){case '+':return a+b;case '−':return a-b;case '×':return a*b;case '÷':return b===0?NaN:a/b;default:return b;}
}
function chooseOperator(next){
 const n=Number(value);if(!Number.isFinite(n))return;
 if(operator&&!waiting){stored=calculate(stored,n,operator);value=format(stored);}
 else stored=n;
 operator=next;waiting=true;finished=false;render();
}
function equals(){
 if(secretEquals())return;
 if(!operator||stored===null||waiting)return;
 value=format(calculate(stored,Number(value),operator));
 stored=null;operator=null;waiting=true;finished=true;render();
}
function clearTap(){
 value='0';stored=null;operator=null;waiting=false;finished=false;
 if(!schoolUnlocked){
  const now=Date.now();
  if(!armed){
   if(!warmup||now-warmupAt>10000){warmup=0;warmupAt=now;}
   warmup++;
   if(warmup>=10){armed=true;acCount=0;}
  }else{
   acCount++;
   if(acCount>=100){schoolUnlocked=true;$('schoolOverlay').classList.add('open');}
  }
  if(armed&&!schoolUnlocked)value=String(acCount);
 }
 render();
}
function action(name){
 if(name==='clear')return clearTap();
 if(name==='sign'&&value!=='0'&&value!=='Error')value=value.startsWith('-')?value.slice(1):'-'+value;
 else if(name==='percent'&&value!=='Error')value=format(Number(value)/100);
 else if(name==='decimal')return inputDecimal();
 else if(name==='backspace'&&!waiting&&!finished&&value!=='Error')value=value.length<=1||(value.length===2&&value[0]==='-')?'0':value.slice(0,-1);
 else if(name==='equals')return equals();
 render();
}
function secretDigit(d){
 if(lightStage==='number'){
  lightDigits+=d;screen.textContent=lightDigits;
  if(lightDigits.length===4){
   if(lightDigits==='1000'){lightStage='pattern';patternIndex=0;patternAt=Date.now();lightDigits='';}
   else{lightDigits='';value='0';screen.textContent='0';}
  }
  return true;
 }
 if(lightStage==='pattern'){
  const expected=patternIndex%2===0?'6':'7';
  if(Date.now()-patternAt>8000||d!==expected){patternIndex=d==='6'?1:0;patternAt=Date.now();lightDigits=d;screen.textContent=d;return true;}
  patternIndex++;lightDigits+=d;screen.textContent=lightDigits;
  if(patternIndex>=16){lightStage='done';document.body.classList.add('light-mode');}
  return true;
 }
 return false;
}
function secretEquals(){
 if(lightStage!=='equals')return false;
 lightEquals++;
 if(lightEquals>=5){lightStage='number';lightDigits='';}
 return true;
}
// Bind each calculator key directly. This avoids relying on event bubbling/delegation on mobile browsers.
keys.querySelectorAll('button').forEach(button=>{
 button.addEventListener('click',()=>{
  if(button.dataset.digit!==undefined)inputDigit(button.dataset.digit);
  else if(button.dataset.op)chooseOperator(button.dataset.op);
  else if(button.dataset.action)action(button.dataset.action);
 });
});
document.addEventListener('keydown',e=>{
 if(/^[0-9]$/.test(e.key))inputDigit(e.key);
 else if(e.key==='.'||e.key===',')inputDecimal();
 else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals();}
 else if(e.key==='Escape'||e.key==='Delete')clearTap();
 else if(e.key==='Backspace')action('backspace');
 else if(({'+':1,'-':1,'*':1,'/':1})[e.key])chooseOperator(({'+':'+','-':'−','*':'×','/':'÷'})[e.key]);
 else if(e.key==='%')action('percent');
});
['gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchstart',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});


const builtInPreset=$('builtInGamePreset');
const gameClose='</scr'+'ipt>';
const builtInGames={
cookie:{
 title:'Cookie Bakery',
 html:`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Bakery</title><style>

</style></head><body><main class="game"><div class="eyebrow">A cozy idle game</div><h1>Cookie Bakery</h1><div class="stats"><div class="stat">Cookies<b id="cookies">0</b></div><div class="stat">Per second<b id="cps">0</b></div><div class="stat">Baked total<b id="total">0</b></div></div><p class="hint">Tap the cookie to bake. Hire helpers to bake while you relax.</p><button class="cookie" id="bake" aria-label="Bake a cookie">🍪</button><div class="shop" id="shop"></div><button class="reset" id="reset">Reset bakery</button></main><script>

function render(){document.getElementById('cookies').textContent=fmt(state.cookies);document.getElementById('total').textContent=fmt(state.total);document.getElementById('cps').textContent=cps().toFixed(1);document.getElementById('shop').innerHTML=items.map((x,i)=>'<button class="upgrade" data-buy="'+i+'" '+(state.cookies<cost(i)?'disabled':'')+'><b>'+x.emoji+' '+x.name+' · '+state.owned[i]+'</b><span>'+x.desc+'<br>Cost: '+fmt(cost(i))+' · +'+x.power+'/sec</span></button>').join('');}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,#642a66,#170e25 70%);color:#fff;font-family:system-ui,sans-serif}.machine{width:min(100%,560px);text-align:center;background:#251432;border:2px solid #d9a7ff;border-radius:28px;padding:clamp(20px,5vw,38px);box-shadow:0 20px 70px #0008}.tag{color:#e8baff;letter-spacing:3px;text-transform:uppercase;font-size:12px}.machine h1{font-size:clamp(34px,8vw,54px);margin:8px}.balance{font-size:18px;color:#f3d9ff}.balance b{font-size:30px;color:#ffe36e}.reels{display:flex;justify-content:center;gap:10px;margin:26px 0}.reel{width:clamp(76px,22vw,130px);height:clamp(90px,25vw,145px);display:grid;place-items:center;background:linear-gradient(#fff,#e9d9ff);border:5px solid #ffcf63;border-radius:18px;color:#251432;font-size:clamp(45px,12vw,76px);box-shadow:inset 0 4px 10px #0003}.spin{border:0;border-radius:999px;background:linear-gradient(135deg,#ffe77b,#ff9d35);color:#35163c;font-weight:900;font-size:20px;padding:16px 46px;cursor:pointer;box-shadow:0 6px 0 #a84e27}.spin:disabled{opacity:.5}.message{min-height:30px;font-size:18px;color:#ffe69b;margin:18px 0}.paytable{color:#d6b8e5;font-size:13px;line-height:1.8}.small{font-size:11px;color:#a88db9;margin-top:16px}
</style></head><body><main class="machine"><div class="tag">Just for fun · no real money</div><h1>🎰 Lucky Slots</h1><div class="balance">Virtual coins <b id="coins">500</b></div><div class="reels"><div class="reel" id="r0">🍒</div><div class="reel" id="r1">⭐</div><div class="reel" id="r2">🍋</div></div><button class="spin" id="spin">SPIN · 10 COINS</button><div class="message" id="message">Try your luck!</div><div class="paytable">Three 7️⃣ = 1000 · Three 💎 = 250 · Three matching = 100<br>Two matching = 20 · Spin costs 10 coins</div><p class="small">Fictional arcade game with free virtual points. No purchases or cash prizes.</p></main><script>
(()=>{
const symbols=['🍒','🍋','🍇','⭐','🔔','💎','7️⃣'];let coins=500,spinning=false;

 try{
  const raw=siteInput.value.trim();if(!raw)throw new Error('Enter a website address first.');
  url=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(raw)?raw:'https://'+raw);
  if(!['http:','https:'].includes(url.protocol))throw new Error('Only HTTP and HTTPS addresses are supported.');
 }catch(err){error.textContent=err.message;return;}
 error.textContent='';output.textContent='';progress.textContent='Connecting…';track.style.display='none';bar.style.width='0';
 button.disabled=true;button.textContent='Loading…';
 try{
  let response=null;const errors=[];
  const attempts=[
   ['Direct',url.href,'direct'],
   ['cors.dev','https://proxy.cors.dev/'+url.href,'proxy'],
   ['AllOrigins','https://api.allorigins.win/raw?url='+encodeURIComponent(url.href),'proxy'],
   ['ThingProxy','https://thingproxy.freeboard.io/fetch/'+url.href,'proxy']
  ];
  for(const [label,endpoint,kind] of attempts){
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(new Error('Request timed out after 18 seconds')),18000);
   try{
    progress.textContent='Trying '+label+'…';
    const candidate=await fetch(endpoint,{mode:'cors',credentials:'omit',redirect:'follow',signal:controller.signal,cache:'no-store'});
    if(!candidate.ok)throw new Error('HTTP '+candidate.status);
    const length=Number(candidate.headers.get('content-length'))||0;
    if(length>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
    response=candidate;lastBaseUrl=kind==='direct'?(candidate.url||url.href):url.href;
    window.clearTimeout(timeout);
    break;
   }catch(err){window.clearTimeout(timeout);controller.abort();errors.push(label+': '+(err.message||'request failed'));}
  }
  if(!response)throw new Error(errors.join(' | '));
  const source=await readWithProgress(response);
  if(new Blob([source]).size>8*1024*1024)throw new Error('Page is larger than the 8 MB safety limit.');
  if(!source.trim())throw new Error('The server returned an empty page.');
  output.textContent=source;
  if(!lastBaseUrl)lastBaseUrl=url.href;
  progress.textContent='Source loaded successfully.';
 }catch(err){
  error.textContent='Could not load source: '+err.message;
  progress.textContent='';
 }finally{button.disabled=false;button.textContent='Load Source';}
}
async function runLoadedSource(){
 const source=$('sourceOutput').textContent,status=$('sourceError');
 if(!source.trim()){status.textContent='Load source first.';return;}
 const tab=window.open('about:blank','_blank');
 if(!tab){status.textContent='Pop-up blocked. Allow pop-ups and try again.';return;}
 try{
  const baseUrl=lastBaseUrl||siteInput.value.trim();
  const base=new URL(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(baseUrl)?baseUrl:'https://'+baseUrl);
  const parsed=new DOMParser().parseFromString(source,'text/html');
  const target=tab.document;
  const root=target.documentElement;
  for(const attr of [...parsed.documentElement.attributes])root.setAttribute(attr.name,attr.value);
  root.innerHTML=parsed.documentElement.innerHTML;
  target.title=parsed.title||base.hostname;
  const baseTag=target.createElement('base');
  baseTag.href=base.href;
  target.head.insertBefore(baseTag,target.head.firstChild);
  target.documentElement.style.cssText='min-height:100%;';
  target.body.style.minHeight='100vh';
  const inertScripts=[...target.querySelectorAll('script')];
  for(const inert of inertScripts){
   if(!inert.isConnected)continue;
   const live=target.createElement('script');
   for(const attr of [...inert.attributes])live.setAttribute(attr.name,attr.value);
   if(!inert.hasAttribute('async'))live.async=false;
   live.textContent=inert.textContent;
   const waitForLoad=live.src&&!live.async?new Promise(resolve=>{
    live.addEventListener('load',resolve,{once:true});
    live.addEventListener('error',resolve,{once:true});
   }):null;
   inert.replaceWith(live);
   if(waitForLoad)await Promise.race([waitForLoad,new Promise(resolve=>setTimeout(resolve,12000))]);
  }
  tab.focus();
  status.textContent='Running the HTML directly in the new about:blank tab (no iframe). External scripts and assets load from the original website when the server allows them.';
 }catch(err){status.textContent='Could not start source: '+(err.message||String(err));}
}
$('runCode').addEventListener('click',runLoadedSource);
$('exitSchool').addEventListener('click',()=>$('schoolOverlay').classList.remove('open'));
$('fullScreen').addEventListener('click',async()=>{
 const panel=document.querySelector('#schoolOverlay .school');
 try{if(document.fullscreenElement){await document.exitFullscreen();panel.classList.remove('fullscreen');}
 else{await panel.requestFullscreen();panel.classList.add('fullscreen');}}
 catch(err){$('sourceError').textContent='Full screen unavailable: '+err.message;}
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.querySelector('#schoolOverlay .school').classList.remove('fullscreen');});
$('copySource').addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText($('sourceOutput').textContent);$('sourceError').textContent='Source copied.';}
 catch(err){$('sourceError').textContent='Copy unavailable: '+err.message;}
});
render();
window.addEventListener('error',e=>{const box=$('sourceError');if(box)box.textContent='App error: '+(e.message||'Unknown JavaScript error');});
window.addEventListener('unhandledrejection',e=>{const box=$('sourceError');if(box)box.textContent='App error: '+(e.reason?.message||String(e.reason));});
})();
